<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SberPI PI Cycle MVP</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">SberPI</div>
      <div class="subtitle">MVP раздела PI-цикл</div>
    </div>
    <div class="api-box">
      <label>
        <span>API</span>
        <input id="apiBase" value="http://localhost:8000/api">
      </label>
      <button id="saveApi">Сохранить</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>PI-цикл</h2>
        <form id="cycleForm" class="stack">
          <div class="row">
            <label><span>Год</span><input name="year" type="number" value="2026" min="2026"></label>
            <label><span>Квартал</span>
              <select name="quarter">
                <option>Q1</option>
                <option>Q2</option>
                <option>Q3</option>
                <option>Q4</option>
              </select>
            </label>
          </div>
          <label><span>Старт PI</span><input name="start_date" type="date" value="2026-07-06"></label>
          <label><span>Спринтов</span><input name="sprint_count" type="number" value="6" min="1" max="12"></label>
          <button class="primary">Создать / открыть</button>
        </form>
      </section>

      <section class="panel">
        <h2>Навигация</h2>
        <nav class="tabs" id="tabs">
          <button data-tab="overview" class="active">Данные PI</button>
          <button data-tab="teams">Команды</button>
          <button data-tab="backlog">Бэклог</button>
          <button data-tab="prep">Pre PI</button>
          <button data-tab="goals">Цели</button>
          <button data-tab="board">Program Board</button>
          <button data-tab="risks">Риски</button>
        </nav>
      </section>
    </aside>

    <section class="content" id="app">
      <div class="empty">Создайте или откройте PI-цикл, чтобы начать работу.</div>
    </section>
  </main>

  <div id="toastRoot" class="toast-root"></div>
  <script src="./app.js"></script>
</body>
</html>
