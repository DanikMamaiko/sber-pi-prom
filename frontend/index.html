const COLOR_RU = {blue:'Голубой', red:'Красный', purple:'Фиолетовый'};
// Цвет-идентификатор задачи (lane hue): детерминированный по id.
// Один и тот же оттенок получают цветной стикер, его белые подзадачи и стрелки —
// сразу видно, что к чему относится и откуда идёт стрелка.
const LANE_HUES = [205, 12, 145, 268, 32, 188, 330, 96, 248, 56, 165, 300];
function issueHue(iss){
  const id = String((iss && iss.id) || '');
  let h = 0; for(let k=0;k<id.length;k++) h = (h*31 + id.charCodeAt(k)) >>> 0;
  return `hsl(${LANE_HUES[h % LANE_HUES.length]} 68% 56%)`;
}
function findIssue(id){ return state.issues.find(i=>i.id===id); }
// Поля, синхронизируемые между инициативой (Pre PI Planning) и целью (Цели).
// Правка на любой из вкладок отражается на другой (единый источник — по № инициативы).
const GOAL_SYNC_FIELDS=['cel','metric','fact','plan','hypo','redesign','product'];
// Все строки-цели (по всем командам), относящиеся к инициативе id.
function goalsForIssue(id){
  const out=[];
  Object.values(state.goals||{}).forEach(rows=>rows.forEach(g=>{ if(g.initNum===id) out.push(g); }));
  return out;
}
// issue → цели
function syncIssueToGoals(iss){
  goalsForIssue(iss.id).forEach(g=>{ GOAL_SYNC_FIELDS.forEach(k=>{ g[k]=iss[k]; }); });
}
// цель → issue
function syncGoalToIssue(g){
  const iss=findIssue(g.initNum); if(!iss) return;
  // копируем только присутствующие в строке-цели поля (у старых строк новых полей нет)
  GOAL_SYNC_FIELDS.forEach(k=>{ if(k in g) iss[k]=g[k]; });
  // Одна инициатива может быть целью нескольких команд-исполнителей.
  // Поддерживаем все её строки синхронными до отправки агрегата в backend.
  syncIssueToGoals(iss);
}
// Трудозатраты (sa/dev/qa): было ли значение внесено/изменено вручную (не из Jira).
//  - в Jira не было данных (jira[role] = null) → любое ненулевое значение = ручной ввод;
//  - в Jira было значение → отличие текущего от него = ручное изменение.
function isEffortEdited(iss,role){
  const jira = iss.jira ? iss.jira[role] : undefined;
  const cur = +iss[role]||0;
  if(jira===undefined || jira===null) return cur!==0;
  return cur !== (+jira||0);
}
// Подсказка (tooltip) для ячейки трудозатрат — что было в Jira и изменено ли вручную.
function effortTitle(iss,role){
  const jira = iss.jira ? iss.jira[role] : undefined;
  const hasJira = !(jira===undefined || jira===null);
  if(!hasJira) return isEffortEdited(iss,role) ? 'Внесено вручную (в Jira данных не было)' : 'В Jira данных нет';
  return isEffortEdited(iss,role) ? `Из Jira: ${+jira||0} · изменено вручную` : `Из Jira: ${+jira||0}`;
}

function round1(n){ return Math.round((+n||0)*10)/10; }
// дни отпуска человека внутри спринта
function personVacation(person,sprint){
  return rangeWorkdaysInPeriod(person.vacation,sprint);
}
function personExtraUnavailable(person,sprint){
  return rangeWorkdaysInPeriod(person.extraUnavailable,sprint);
}
function personRate(person){
  const n=parseFloat(String(person.rate??'').replace(',','.'));
  return Number.isFinite(n) && n>=0 ? n : 1;
}
function personEfficiency(person){
  if(person.efficiency===null || person.efficiency===undefined || String(person.efficiency).trim()==='') return null;
  const n=parseFloat(String(person.efficiency).replace(',','.'));
  return Number.isFinite(n) && n>=0 ? n : null;
}
// доступная ёмкость человека в конкретном спринте
//   Доступная = Плановая − отпуск − Плановая×%церемоний − Плановая×%рисков (проценты от Плановой)
function personAvail(person,sprint){
  const id=currentCycleId(),cycle=id&&state.cycles&&state.cycles[id];
  const cached=id&&person.uid&&capacityComputedCycles[id]&&capacityComputedCycles[id].members[person.uid];
  if(cached&&cycle&&(sprint.week===null||sprint.week===undefined)&&
      cached.inputKey===capacityMemberInputKey(person,cycle,id)){
    const row=(cached.sprints||[]).find(x=>+x.sprint_index===+sprint.index);
    if(row)return +row.available_capacity||0;
  }
  const rate=personRate(person);
  const planned=sprint.workdays*rate;
  const vac=personVacation(person,sprint)*rate;
  const extra=personExtraUnavailable(person,sprint)*rate;
  const cer=planned*(+person.ceremonyPct||0)/100;
  const risk=planned*(+person.riskPct||0)/100;
  let avail=Math.max(0, planned - vac - extra - cer - risk);
  const eff=personEfficiency(person);
  if(eff!==null) avail*=eff;
  return avail;
}
// план роли в спринте = сумма доступной по всем людям этой роли
function rolePlan(team,role,sprint){
  const cap=state.capacity[teamKey(team.tribe,team.name)]||[];
  return cap.filter(p=>p.role===role).reduce((s,p)=>s+personAvail(p,sprint),0);
}
// потреблённая ёмкость роли в спринте:
//  - если issue НЕ декомпозирован (нет белых) — берём значение роли с цветного стикера в его спринте;
//  - если декомпозирован (есть ≥1 белый) — значения цветного игнорируются, считаем по белым.
function consumedEffort(team,role,sprintIndex,weekIndex=null){
  let sum=0;
  state.issues.filter(i=>issuePrimaryTeam(i)===team.name && i.onBoard).forEach(i=>{
    const subs=i.subtasks||[];
    if(subs.length>0){
      subs.forEach(st=>{
        if(st.role===role && st.sprint===sprintIndex && (weekIndex===null || itemWeek(st)===weekIndex)) sum+=(+st.cap||0);
      });
    }else if(i.sprint===sprintIndex && (weekIndex===null || itemWeek(i)===weekIndex)){
      sum += issueTeamEffort(i,team.name,role);
    }
  });
  return sum;
}

/* ---- Сохранение позиции прокрутки и фокуса при перерисовке ----------------
   render() пересобирает #app целиком, поэтому горизонтально прокрученная таблица
   после правки любого поля «прыгала» в начало. Перед перерисовкой снимаем позиции
   всех контейнеров [data-scroll-key] и активное поле, после — возвращаем на место. */
// Признак текущего экрана: восстанавливаем позицию только если экран не сменился.
function viewSig(){
  return [state.ui.mode,state.ui.tab,state.ui.budgetTab,state.ui.backlogTribe,state.ui.backlogTeamFilter,
          state.ui.prepTribe,state.ui.prepTeamFilter,state.ui.budgetScopeTribe,state.ui.budgetScopeTeam].join('|');
}
// Селектор активного поля, переживающий перерисовку: собираем из data-атрибутов
// строки/столбца — они у новой разметки те же самые.
const FOCUS_ATTRS=['data-bk','data-bp','data-bk-exec','data-bk-comp',
                   'data-pi','data-pk','data-pi-exec','data-pi-comp','data-ba','data-bd','data-bdr','data-k',
                   'data-ei','data-c'];
function focusSelOf(el){
  if(!el || !el.getAttribute) return null;
  const parts=FOCUS_ATTRS.filter(a=>el.hasAttribute(a))
    .map(a=>`[${a}="${CSS.escape(el.getAttribute(a))}"]`);
  return parts.length ? el.tagName.toLowerCase()+parts.join('') : null;
}
function captureViewPos(){
  const pos={sig:viewSig(), boxes:{}, win:{x:window.scrollX,y:window.scrollY}};
  document.querySelectorAll('[data-scroll-key]').forEach(el=>{
    pos.boxes[el.dataset.scrollKey]={l:el.scrollLeft,t:el.scrollTop};
  });
  const a=document.activeElement;
  const sel=(a && a!==document.body) ? focusSelOf(a) : null;
  if(sel){
    pos.focus=sel;
    // selectionStart есть не у всех типов полей (например, input[type=number] бросает)
    try{ if(typeof a.selectionStart==='number'){ pos.selStart=a.selectionStart; pos.selEnd=a.selectionEnd; } }catch(_){}
  }
  return pos;
}
function restoreViewPos(pos){
  if(!pos || pos.sig!==viewSig()) return;
  if(pos.focus){
    const el=document.querySelector(pos.focus);
    if(el){
      el.focus({preventScroll:true});  // прокрутку выставим сами — ниже
      try{ if(pos.selStart!=null) el.setSelectionRange(pos.selStart,pos.selEnd); }catch(_){}
    }
  }
  document.querySelectorAll('[data-scroll-key]').forEach(el=>{
    const p=pos.boxes[el.dataset.scrollKey];
    if(p){ el.scrollLeft=p.l; el.scrollTop=p.t; }
  });
  window.scrollTo(pos.win.x,pos.win.y);
}

function render(){
  const pos=captureViewPos();
  // попап фильтра живёт на body — закрываем его при любой перерисовке;
  // контекст таблиц пересобирают view-функции ниже
  closeColFilterPop(); colFilterCtx={};
  if(state.ui.mode==='budget' && state.ui.budgetYear){
    ensureBudgetYear(state.ui.budgetYear);
    renderNav();
    const app=$('#app');
    switch(state.ui.budgetTab){
      case 'budgetData':       app.innerHTML=viewBudgetData();       bindBudgetData();       break;
      case 'backlog':          app.innerHTML=viewBacklog();          bindBacklog();          break;
      case 'budgetAssessment': app.innerHTML=viewBudgetAssessment(); bindBudgetAssessment(); break;
      case 'budget':           app.innerHTML=viewBudget();           bindBudget();           break;
      case 'budgetVadarodTeams': app.innerHTML=viewBudgetVadarodTeams(); bindBudgetVadarodTeams(); break;
      default: state.ui.budgetTab='budgetData'; save(); render(); return;
    }
    restoreViewPos(pos);
    return;
  }
  const cid=currentCycleId();
  // PI-цикл не выбран — показываем стартовую страницу выбора года/квартала
  if(state.ui.mode!=='pi' || !cid || !state.cycles[cid]){
    const nav=$('#nav'); if(nav) nav.innerHTML='';
    const app=$('#app'); app.innerHTML=viewLanding(); bindLanding();
    return;
  }
  activateCycle(cid);
  renderNav();
  const app=$('#app');
  switch(state.ui.tab){
    case 'data':    app.innerHTML=viewData();    bindData();    break;
    case 'backlog': app.innerHTML=viewBacklog(); bindBacklog(); break;
    case 'prep':  app.innerHTML=viewPrep();  bindPrep();  break;
    case 'goals': app.innerHTML=viewGoals(); bindGoals(); break;
    case 'pb':    app.innerHTML=viewPB();    bindPB();    break;
    case 'teams': app.innerHTML=viewTeams(); bindTeams(); break;
    case 'risks': app.innerHTML=viewRisks(); bindRisks(); break;
  }
  restoreViewPos(pos);

// Каноническая вкладка PI Data: DOM строится только из read-model backend.
function piCascadeMessage(detail){
  const affected=detail&&detail.affected||{};
  const summary=Object.entries(affected).filter(([,count])=>count).map(([name,count])=>`${name}: ${count}`).join(', ');
  return `Изменение требует каскадной обработки связанных данных${summary?` (${summary})`:''}. Продолжить?`;
}
async function refreshPiProjectionsAfterDataCommand(){
  const reads=[];
  if(backlogApiReady) reads.push(loadBacklogBoard());
  if(prePiApiReady) reads.push(loadPrePiCycles());
  if(goalsApiReady) reads.push(loadGoalsCycles());
  if(teamBoardsApiReady) reads.push(loadTeamBoardsCycles());
  if(capacityApiReady) reads.push(loadCapacityCycles());
  if(programBoardApiReady) reads.push(loadProgramBoardCycles());
  if(risksApiReady) reads.push(loadRisksCycles());
  await Promise.all(reads);
}
async function executePiDataCommand(path,options={},cascadeBody=null){
  try{
    await piDataCommand(path,options);
  }catch(error){
    const cascade=error&&error.status===409&&error.detail&&error.detail.code==='cascade_confirmation_required';
    if(cascade&&cascadeBody&&window.confirm(piCascadeMessage(error.detail))){
      await piDataCommand(path,{...options,body:{...(options.body||{}),...cascadeBody}});
    }else{
      if(error&&error.status===409&&!cascade){
        reportOptimisticConflict(error);
        await loadPiDataView(currentCycleId()).catch(()=>{});
        render();
      }
      throw error;
    }
  }
  await refreshPiProjectionsAfterDataCommand().catch(error=>console.error('Projection refresh failed',error));
  render();
  toast('Изменения сохранены в backend',{type:'success'});
}

/* =====================================================================
   ФИЛЬТРЫ ПО СТОЛБЦАМ ТАБЛИЦ («Бэклог команд» и «Pre PI Planning»)
   Excel-подобный фильтр: в шапке столбца — воронка, по клику открывается
   список уникальных значений с чекбоксами.
   Описание столбца: {k, label, val?} — val(row) возвращает значение или
   массив значений (многозначные столбцы, напр. «АС»).
   Фильтр столбца — массив выбранных значений; пустой/отсутствует = «все».
   scope: 'bk' | 'prep:upper' | 'prep:lower'.
===================================================================== */
const FILTER_EMPTY_LABEL='(Пусто)';
// Контекст таблиц текущего рендера: scope -> {rows, cols}. Нужен обработчикам клика.
let colFilterCtx={};
function colFilters(scope){
  if(!state.ui.colFilters) state.ui.colFilters={};
  return state.ui.colFilters[scope] = state.ui.colFilters[scope] || {};
}
function clearColFilters(scope){ if(state.ui.colFilters) delete state.ui.colFilters[scope]; }

/* ---- Сортировка по столбцу ---- */
// Активна не более чем по одному столбцу таблицы: {k, dir:'asc'|'desc'}.
function colSort(scope){ return (state.ui.colSort||{})[scope]||null; }
function setColSort(scope,k,dir){
  if(!state.ui.colSort) state.ui.colSort={};
  state.ui.colSort[scope]={k,dir};
}
function clearColSort(scope){ if(state.ui.colSort) delete state.ui.colSort[scope]; }
// Подпись столбца, по которому идёт сортировка (для плашки над таблицей).
function sortColLabel(scope,k){
  const ctx=colFilterCtx[scope];
  const col=ctx && ctx.cols.find(c=>c.k===k);
  return col?col.label:k;
}
// Сброс состояния столбцов таблицы (и фильтры, и сортировка).
function clearColState(scope){ clearColFilters(scope); clearColSort(scope); }
// Оба блока Pre PI сразу: при смене трайба/команды состав строк меняется,
// поэтому фильтр и сортировку по столбцам снимаем.
function clearPrepColFilters(){ clearColState('prep:upper'); clearColState('prep:lower'); }
// Сообщение при попытке перетащить строку, когда порядок задаёт сортировка.
const SORT_DRAG_MSG='Порядок строк задаёт сортировка — сбросьте её, чтобы менять порядок вручную';
function colFiltersCount(scope){
  const f=(state.ui.colFilters||{})[scope]||{};
  return Object.keys(f).filter(k=>Array.isArray(f[k])&&f[k].length).length;
}
// Значения строки в столбце — всегда массив строк; пустое значение = ''.
function colValues(row,col){
  const raw = col.val ? col.val(row) : row[col.k];
  const arr = Array.isArray(raw) ? raw : [raw];
  const out=[];
  arr.forEach(x=>{
    const v = (x===null||x===undefined) ? '' : String(x).trim();
    if(!out.includes(v)) out.push(v);
  });
  return out.length ? out : [''];
}
// Сравнение двух значений столбца: числа — по величине, остальное — по алфавиту (ru).
// Приоритеты и оценки хранятся строками, поэтому «10» должно идти после «9», а не после «1».
function compareColVals(a,b){
  const na=parseFloat(a), nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb)&&String(na)===a&&String(nb)===b) return na-nb;
  return a.localeCompare(b,'ru');
}
// Уникальные значения столбца по набору строк (для списка в попапе).
function colUniqueValues(rows,col){
  const set=new Set();
  rows.forEach(r=>colValues(r,col).forEach(v=>set.add(v)));
  return [...set].sort((a,b)=>{
    if(a==='') return 1;
    if(b==='') return -1;
    return compareColVals(a,b);
  });
}
// Сортировка строк по выбранному столбцу. Пустые значения всегда внизу (как в Excel),
// независимо от направления; равные значения сохраняют исходный порядок (стабильно).
// У многозначных столбцов (напр. «АС») сортируем по первому значению.
function applyColSort(rows,cols,scope){
  const s=colSort(scope); if(!s) return rows;
  const col=cols.find(c=>c.k===s.k); if(!col) return rows;
  const dir=s.dir==='desc'?-1:1;
  return rows.map((r,i)=>({r,i})).sort((a,b)=>{
    const va=colValues(a.r,col)[0], vb=colValues(b.r,col)[0];
    if(va==='' || vb===''){ return va===vb ? a.i-b.i : (va===''?1:-1); }
    return compareColVals(va,vb)*dir || a.i-b.i;
  }).map(x=>x.r);
}
// Строка проходит фильтры по всем столбцам (кроме исключённого — для списка значений в попапе).
function rowMatchesColFilters(row,cols,filters,skipKey){
  return cols.every(c=>{
    if(c.k===skipKey) return true;
    const sel=filters[c.k];
    if(!Array.isArray(sel)||!sel.length) return true;
    return colValues(row,c).some(v=>sel.includes(v));
  });
}
function applyColFilters(rows,cols,scope){
  const f=colFilters(scope);
  if(!colFiltersCount(scope)) return rows;
  return rows.filter(r=>rowMatchesColFilters(r,cols,f));
}
// Шапка столбца с кнопкой фильтра/сортировки. Стрелка ↑/↓ показывает активную сортировку.
function filterThHTML(col,scope,extraClass){
  const on=colFiltersCount(scope) && Array.isArray(colFilters(scope)[col.k]) && colFilters(scope)[col.k].length;
  const s=colSort(scope);
  const sorted=!!(s && s.k===col.k);
  const arrow=sorted?(s.dir==='asc'?'↑':'↓'):'';
  return `<th class="${extraClass||''}"><div class="th-f"><span>${esc(col.label)}</span>`+

    `<button class="col-f${on?' on':''}${sorted?' sorted':''}" data-fscope="${esc(scope)}" data-fcol="${esc(col.k)}" title="Фильтр и сортировка по столбцу «${esc(col.label)}»">▼</button></div></th>`;

// Плашка «Фильтры: N · Сортировка: столбец» над таблицей — только когда что-то активно.
function tableToolsBarHTML(scope,label){
  const n=colFiltersCount(scope), s=colSort(scope);
  if(!n && !s) return '';
  const parts=[];
  if(n) parts.push(`Фильтры${label?` (${esc(label)})`:''}: <b>${n}</b> ${n===1?'столбец':'столб.'}
    <button class="ghost colf-clear" data-fclear="${esc(scope)}">Сбросить фильтры</button>`);
  if(s) parts.push(`Сортировка: <b>${esc(sortColLabel(scope,s.k))}</b> ${s.dir==='asc'?'↑':'↓'}
    <button class="ghost colf-clear" data-sclear="${esc(scope)}">Сбросить сортировку</button>`);
  return `<div class="colf-bar">${parts.join('<span class="colf-sep">·</span>')}</div>`;
}

let colfPop=null;
function closeColFilterPop(){
  if(colfPop){ colfPop.remove(); colfPop=null; }
  document.removeEventListener('mousedown',colfOutside,true);
}
function colfOutside(e){
  if(colfPop && !colfPop.contains(e.target) && !e.target.closest('[data-fcol]')) closeColFilterPop();
}
function openColFilterPop(btn,scope,colKey){
  closeColFilterPop();
  const ctx=colFilterCtx[scope]; if(!ctx) return;
  const col=ctx.cols.find(c=>c.k===colKey); if(!col) return;
  const filters=colFilters(scope);
  const sel=Array.isArray(filters[colKey])?filters[colKey].slice():[];
  // Значения, доступные с учётом фильтров по ДРУГИМ столбцам (как в Excel),
  // плюс уже выбранные — чтобы выбор не «пропадал» из списка.
  const base=ctx.rows.filter(r=>rowMatchesColFilters(r,ctx.cols,filters,colKey));
  const vals=colUniqueValues(base,col);
  sel.forEach(v=>{ if(!vals.includes(v)) vals.push(v); });

  const s=colSort(scope);
  const sdir = (s && s.k===colKey) ? s.dir : null;

  const pop=document.createElement('div');
  pop.className='colf-pop';
  pop.innerHTML=`<div class="colf-head">${esc(col.label)}</div>
    <div class="colf-sort">
      <button class="colf-sbtn${sdir==='asc'?' on':''}" data-colf-sort="asc" title="Сортировать по возрастанию (пустые — внизу)">↑ По возрастанию</button>
      <button class="colf-sbtn${sdir==='desc'?' on':''}" data-colf-sort="desc" title="Сортировать по убыванию (пустые — внизу)">↓ По убыванию</button>
    </div>
    <input class="colf-search" placeholder="Поиск…">
    <label class="colf-item colf-all"><input type="checkbox" class="colf-allbox"><span>Выделить всё</span></label>
    <div class="colf-list">${
      vals.map(v=>`<label class="colf-item" data-v="${esc(v)}"><input type="checkbox" class="colf-box" ${sel.includes(v)?'checked':''}>
        <span class="${v===''?'muted':''}">${v===''?FILTER_EMPTY_LABEL:esc(v)}</span></label>`).join('')
      || `<div class="muted" style="padding:6px 4px">Нет значений</div>`
    }</div>
    <div class="colf-btns">
      <button class="ghost" data-colf-reset>Сбросить</button>
      <button class="primary" data-colf-apply>Применить</button>
    </div>`;
  document.body.appendChild(pop);
  colfPop=pop;

  // позиционирование: под кнопкой, с удержанием в пределах окна
  const r=btn.getBoundingClientRect();
  const w=pop.offsetWidth, h=pop.offsetHeight;
  let left=Math.min(r.left, window.innerWidth-w-8);
  let top=r.bottom+4;
  if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-4);
  pop.style.left=Math.max(8,left)+'px';
  pop.style.top=top+'px';

  const boxes=()=>[...pop.querySelectorAll('.colf-list .colf-item:not([hidden]) .colf-box')];
  const allBox=pop.querySelector('.colf-allbox');
  const syncAll=()=>{
    const b=boxes(), on=b.filter(x=>x.checked).length;
    allBox.checked = b.length>0 && on===b.length;
    allBox.indeterminate = on>0 && on<b.length;
  };
  syncAll();
  allBox.onchange=()=>{ boxes().forEach(x=>{ x.checked=allBox.checked; }); syncAll(); };
  pop.querySelectorAll('.colf-box').forEach(x=>x.onchange=syncAll);
  const search=pop.querySelector('.colf-search');
  search.oninput=()=>{
    const q=search.value.trim().toLowerCase();
    pop.querySelectorAll('.colf-list .colf-item').forEach(it=>{
      const v=it.dataset.v||'';
      const text=(v===''?FILTER_EMPTY_LABEL:v).toLowerCase();
      it.hidden = !!q && !text.includes(q);
    });
    syncAll();
  };
  // сортировка: повторный клик по активному направлению — снимает её
  pop.querySelectorAll('[data-colf-sort]').forEach(b=>b.onclick=()=>{
    const dir=b.dataset.colfSort;
    if(sdir===dir) clearColSort(scope); else setColSort(scope,colKey,dir);
    closeColFilterPop(); save(); render();
  });
  pop.querySelector('[data-colf-reset]').onclick=()=>{
    delete colFilters(scope)[colKey]; closeColFilterPop(); save(); render();
  };
  pop.querySelector('[data-colf-apply]').onclick=()=>{
    const picked=[];
    pop.querySelectorAll('.colf-list .colf-item').forEach(it=>{
      const b=it.querySelector('.colf-box');
      if(b && b.checked) picked.push(it.dataset.v||'');
    });
    // выбрано всё (или ничего) — фильтр по столбцу снимается
    if(!picked.length || picked.length===vals.length) delete colFilters(scope)[colKey];
    else colFilters(scope)[colKey]=picked;
    closeColFilterPop(); save(); render();
  };
  setTimeout(()=>{ search.focus(); document.addEventListener('mousedown',colfOutside,true); },0);
}
// Общий биндинг кнопок фильтра — вызывается из bindBacklog()/bindPrep().
function bindColFilters(){
  document.querySelectorAll('[data-fcol]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    openColFilterPop(el, el.dataset.fscope, el.dataset.fcol);
  });
  document.querySelectorAll('[data-fclear]').forEach(el=>el.onclick=()=>{
    clearColFilters(el.dataset.fclear); save(); render();
  });
  document.querySelectorAll('[data-sclear]').forEach(el=>el.onclick=()=>{
    clearColSort(el.dataset.sclear); save(); render();
  });
}

function backlogRows(){ return backlogBoard&&Array.isArray(backlogBoard.items)?backlogBoard.items:[]; }

}

function backlogCascadeMessage(detail){
  const summary=Object.entries(detail&&detail.affected||{}).filter(([,count])=>count)
    .map(([name,count])=>`${name}: ${count}`).join(', ');
  return `Удаление разорвёт связи с уже отправленными инициативами${summary?` (${summary})`:''}. Продолжить?`;
}
async function executeBacklogCommand(path,method,body={},allowCascade=false){
  try{
    applyBacklogBoard(await backlogMutation(path,method,body));
  }catch(error){
    const cascade=allowCascade&&error&&error.status===409&&error.detail&&error.detail.code==='cascade_confirmation_required';
    if(cascade&&window.confirm(backlogCascadeMessage(error.detail))){
      applyBacklogBoard(await backlogMutation(path,method,{...body,confirm_cascade:true}));
    }else{
      reportBacklogSyncError(error);
      throw error;
    }
  }
  render();
  return backlogBoard;
}

async function sendBacklogToPrePI(tribe){
  const q=state.ui.backlogQuarter, y=state.ui.backlogYear;
  if(!q||!y){ toast('Сначала выберите Квартал и Год',{type:'warn'}); return; }
  const target=cycleId(y,q);
  try{
    const before=new Set(backlogRows().filter(row=>(row.sent_to||[]).includes(target)).map(row=>row.id));
    await executeBacklogCommand('/backlog-board/dispatch','POST',{
      tribe,target_year:+y,target_quarter:q,
    });
    const sent=backlogRows().filter(row=>!before.has(row.id)&&(row.sent_to||[]).includes(target)).length;
    await loadPrePiCycles().catch(()=>{});
    toast(`Отправлено на Pre PI (${target}): ${sent} ${sent===1?'инициатива':'инициатив'}`,{type:'success',title:'Отправлено на Pre PI Planning'});
  }catch(error){
    if(error&&error.status===409)return;
  }
}
function budgetIssueKey(it){ return it && (it._uid || it.id); }

function findBacklogByBudgetKey(key){

function budgetAssessmentFor(it,year){

  if(!key) return null;
  b.assessments[key]=ensureAssessmentShape(b.assessments[key]||{status:'На рассмотрении'});

function sendBacklogToBudgetAssessment(tribe){
  const y=state.ui.backlogYear || state.ui.budgetYear;
  if(!y){ toast('Сначала выберите год',{type:'warn'}); return; }
  const b=ensureBudgetYear(y);
  const list=backlogRows().filter(row=>row.tribe===tribe).map(backlogViewItem);
  const matched=list.filter(it=>backlogInitiativeYear(it)===String(y));
  if(!matched.length){ toast(`Нет инициатив с годом реализации ${y}`,{type:'info'}); return; }
  let sent=0;
  matched.forEach(it=>{
    ensureBacklogShape(it);
    if(!it.id) it.id='INIT-'+uid().slice(1,6).toUpperCase();
    const key=budgetIssueKey(it);
    b.assessments[key]=ensureAssessmentShape(b.assessments[key]||{status:'На рассмотрении'});
    sent++;
  });
  state.ui.budgetYear=+y;
  state.ui.budgetTab='budgetAssessment';
  save(); render();
  toast(`Отправлено на оценку (${y}): ${sent} ${sent===1?'инициатива':'инициатив'}`,{type:'success',title:'Оценка инициатив'});
}

// Ручка перетаскивания строки бэклога. При активной сортировке порядок задаёт она,
// поэтому ручка гаснет — иначе перетаскивание молча не давало бы результата.
function bkDragHandleHTML(it){
  if(colSort('bk')) return `<span class="row-drag off" title="${SORT_DRAG_MSG}">⠿</span>`;
  return `<span class="row-drag" draggable="true" data-bk-drag="${esc(it._uid)}" title="Перетащите, чтобы изменить порядок">⠿</span>`;
}
// Перетаскивание строк «Бэклога команд». В отличие от Pre PI, вся строка состоит из
// полей ввода, поэтому тянем только за ручку в ячейке «№ Инициативы».
let bkDragUid=null;
function bindBacklogRowDrag(tribe){
  document.querySelectorAll('[data-bk-drag]').forEach(h=>{
    h.addEventListener('dragstart',e=>{
      bkDragUid=h.dataset.bkDrag;
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain',bkDragUid); }catch(_){}
      const tr=h.closest('tr'); if(tr) tr.classList.add('dragging');
    });
    h.addEventListener('dragend',()=>{
      const tr=h.closest('tr'); if(tr) tr.classList.remove('dragging');
      clearPrepRowDropMarkers(); bkDragUid=null;
    });
  });
  document.querySelectorAll('tr[data-bk-row]').forEach(tr=>{
    tr.addEventListener('dragover',e=>{
      if(!bkDragUid || tr.dataset.bkRow===bkDragUid) return;
      e.preventDefault();
      const after=isPrepDropAfter(tr,e);
      tr.classList.toggle('rowdragover-before',!after);
      tr.classList.toggle('rowdragover-after',after);
    });
    tr.addEventListener('dragleave',()=>clearPrepRowDropMarkers(tr));
    tr.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      clearPrepRowDropMarkers(tr);
      moveBacklogRow(tribe,bkDragUid,tr.dataset.bkRow,isPrepDropAfter(tr,e));
    });
  });
}
// Порядок меняем в полном списке бэклога трайба, даже если часть строк скрыта
// фильтрами по команде/столбцам: цель определяем по её позиции в этом списке.
async function moveBacklogRow(tribe,dragUid,targetUid,after){
  if(!dragUid || !targetUid || dragUid===targetUid) return;
  const canonical=backlogRows().map(row=>row.id);
  const list=backlogRows().filter(row=>row.tribe===tribe).map(row=>row.id);
  const from=list.indexOf(dragUid);
  if(from<0) return;
  const [item]=list.splice(from,1);
  const to=list.indexOf(targetUid);
  if(to<0){ list.splice(from,0,item); return; }  // цель исчезла — возвращаем на место
  list.splice(after?to+1:to,0,item);
  let tribeIndex=0;
  const order=canonical.map(id=>{
    const row=findBacklogRow(id);
    return row&&row.tribe===tribe?list[tribeIndex++]:id;
  });
  try{ await executeBacklogCommand('/backlog-board/order','PUT',{item_ids:order}); }
  catch(_){ }
}

function budgetYear(){ return state.ui.budgetYear || state.ui.landingYear || 2026; }
function budgetData(){ return ensureBudgetYear(budgetYear()); }
function num(v){ return +String(v??'').replace(',','.') || 0; }
function fmtNum(v,d=1){ return (Math.round((+v||0)*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('ru-RU'); }
function fmtMoney(v){ return Math.round(+v||0).toLocaleString('ru-RU'); }
function fmtMoneyK(v){ return fmtNum((+v||0)/1000,1); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function budgetWorkdaysTotal(b=budgetData()){
  return BUDGET_MONTHS.reduce((s,[k])=>s+(+b.workdays[k]||0),0);
}
function budgetSHE(eff,b=budgetData()){
  const wd=budgetWorkdaysTotal(b);
  return wd ? (+eff||0)/wd : 0;
}
function budgetCompSHE(v,b=budgetData()){ return budgetSHE(v,b); }
function budgetVadarodValue(eff,b=budgetData()){
  return (+eff||0) * (+b.rateVadarod||0) * (+b.utilization||0);
}
function budgetTeamObjects(b=budgetData()){
  return (b.vadarodTeams||[])
    .map(t=>({tribe:String(t.tribe||'').trim(),name:String(t.team||'').trim()}))
    .filter(t=>t.tribe && t.name);
}
function budgetTribes(){
  const seen=[];
  budgetTeamObjects().forEach(t=>{ if(!seen.includes(t.tribe)) seen.push(t.tribe); });
  return seen;
}
function budgetTeamsOfTribe(tribe){
  return budgetTeamObjects().filter(t=>t.tribe===tribe);
}
function budgetTeamByName(name){
  return budgetTeamObjects().find(t=>t.name===name)||null;
}
function budgetFirstTeam(scope=budgetScope()){
  const teams=budgetTeamObjects();
  if(scope.team) return scope.team;
  if(scope.tribe){
    const t=budgetTeamsOfTribe(scope.tribe)[0];
    if(t) return t.name;
  }
  return (teams[0]&&teams[0].name)||'';
}
function makeBudgetExecutor(name){
  const comps={}; BUDGET_COMPS.forEach(c=>{ comps[c]=0; });
  return {team:name||'', comps, attractions:[]};
}
function teamTribe(name){
  const bt=budgetTeamByName(name);
  if(bt) return bt.tribe;
  if(state.ui && state.ui.mode==='budget') return '';
  const t=allCycleTeams().find(x=>x.name===name);
  return t && t.tribe || '';
}
function budgetCompValue(comps,comp){
  const c=comps||{};
  return comp==='DES' ? ((+c.DES||0)+(+c.DEV||0)) : (+c[comp]||0);
}
function emptyBudgetComps(){
  const out={}; BUDGET_COMPS.forEach(c=>out[c]=0); return out;
}
function addBudgetComps(dst,src,scale=1){
  BUDGET_COMPS.forEach(c=>{ dst[c]+=(+src[c]||0)*scale; });
  return dst;
}
function vadarodRowKey(r){ return `${r.tribe||''}||${r.team||''}`; }
function cloneVadarodRows(rows){
  return (rows||[]).map(r=>{
    const out={tribe:r.tribe||'',team:r.team||''};
    BUDGET_COMPS.forEach(c=>out[c]=+r[c]||0);
    return out;
  });
}
function syncVadarodRows(b){
  if(!b) return;
  const old=new Map((b.vadarodRows||[]).map(r=>[vadarodRowKey(r),r]));
  b.vadarodRows=(b.vadarodTeams||[]).map(t=>{
    const key=vadarodRowKey(t);
    const prev=old.get(key)||{};
    const row={tribe:t.tribe||'',team:t.team||''};
    BUDGET_COMPS.forEach(c=>row[c]=+prev[c]||0);
    return row;
  });
}
function latestVadarodSnapshot(b){
  const snaps=(b.vadarodSnapshots||[]).filter(s=>s.date).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return snaps[0]||null;
}
function selectedVadarodSnapshot(b,date){
  const snaps=b.vadarodSnapshots||[];
  if(date){
    const exact=snaps.find(s=>s.date===date);
    if(exact) return exact;
    const prev=snaps.filter(s=>s.date && s.date<=date).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    if(prev) return prev;
  }
  return latestVadarodSnapshot(b);
}
function budgetOwnerInScope(it,scope=budgetScope()){
  if(!scope.tribe && !scope.team) return !!budgetTeamByName(it.owner);
  if(scope.team) return it.owner===scope.team;
  return teamTribe(it.owner)===scope.tribe;
}
function budgetScope(){
  let tribe=state.ui.budgetScopeTribe||null;
  let team=state.ui.budgetScopeTeam||null;
  if(tribe && !budgetTribes().includes(tribe)){ tribe=null; team=null; }
  if(team && !budgetTeamsOfTribe(tribe).some(t=>t.name===team)) team=null;
  return {tribe, team};
}
function executorInScope(ex,scope=budgetScope()){
  if(!scope.tribe && !scope.team) return true;
  if(scope.team) return ex.team===scope.team;
  return teamTribe(ex.team)===scope.tribe;
}
function itemInBudgetScope(it,scope=budgetScope()){
  if(!scope.tribe && !scope.team) return true;
  if(state.ui.budgetAssessMode==='vadarod' || state.ui.budgetAssessMode==='vendor') return budgetOwnerInScope(it,scope);
  if(scope.team) return it.owner===scope.team || issueExecTeams(it).includes(scope.team);
  return teamTribe(it.owner)===scope.tribe || issueExecutors(it).some(ex=>teamTribe(ex.team)===scope.tribe);
}
function budgetEffortForScope(it,scope=budgetScope()){
  return issueExecutors(it).reduce((sum,ex)=>{
    if(!executorInScope(ex,scope)) return sum;
    const comps=ex.comps||{};
    return sum+Object.keys(comps).reduce((s,k)=>s+(+comps[k]||0),0);
  },0);
}
function budgetCompForScope(it,comp,scope=budgetScope()){
  return issueExecutors(it).reduce((sum,ex)=>sum+(executorInScope(ex,scope)?budgetCompValue(ex.comps,comp):0),0);
}
function budgetAssessmentItems(year=budgetYear()){
  ensureBudgetYear(year);
  return budgetInitiativeItems(year).concat(budgetLegacyAssessmentItems(year));
}
function budgetInitiativeItems(year=budgetYear()){
  const b=ensureBudgetYear(year);
  return (b.vadarodInitiatives||[]).map(v=>{
    ensureBudgetInitiativeShape(v);
    return {kind:'vadarod',key:v._uid,it:v,a:v};
  });
}
function budgetLegacyAssessmentItems(year=budgetYear()){
  const b=ensureBudgetYear(year);
  const out=[];
  Object.keys(b.assessments||{}).forEach(key=>{
    const found=findBacklogByBudgetKey(key);
    if(!found) return;
    ensureBacklogShape(found.it);
    out.push({kind:'legacy-vadarod',key,tribe:found.tribe,it:found.it,a:ensureAssessmentShape(b.assessments[key])});
  });
  return out;
}
function budgetVendorItems(){
  const b=budgetData();
  return (b.vendorRows||[]).map(v=>{
    ensureVendorShape(v);
    return {kind:'vendor',key:v._uid,it:v,a:v};
  });
}
function filteredBudgetAssessmentItems(){
  const statuses=state.ui.budgetStatuses && state.ui.budgetStatuses.length ? state.ui.budgetStatuses : BUDGET_STATUSES;
  const scope=budgetScope();
  if((state.ui.budgetAssessMode||'vadarod')==='vendor'){
    return budgetVendorItems().filter(r=>statuses.includes(r.a.status) && budgetOwnerInScope(r.it,scope));
  }
  return budgetAssessmentItems().filter(r=>statuses.includes(r.a.status) && itemInBudgetScope(r.it,scope));
}
function assessmentBudgetSummary(rows,scope=budgetScope()){
  const b=budgetData();
  const mode=state.ui.budgetAssessMode||'vadarod';
  const totalEff=rows.reduce((s,r)=>s+(mode==='vadarod' ? budgetBaseEffort(r.it,scope) : budgetEffortForScope(r.it,scope)),0);
  const vendorCapex=rows.reduce((s,r)=>s+(+r.a.capex||0),0);
  const vendorOpex=rows.reduce((s,r)=>s+(+r.a.opex||0),0);
  const fin=rows.reduce((s,r)=>s+(+r.a.finEffect||0),0);
  const comps={}; BUDGET_COMPS.forEach(c=>comps[c]=rows.reduce((s,r)=>s+budgetBaseComp(r.it,c,scope),0));
  return {comps,totalEff,she:budgetSHE(totalEff,b),vadarod:budgetVadarodValue(totalEff,b),capex:vendorCapex,opex:vendorOpex,vendor:vendorCapex+vendorOpex,fin};
}
function budgetBaseExecutor(ex,scope=budgetScope()){
  if(!budgetTeamByName(ex.team)) return false;
  if(!scope.tribe && !scope.team) return true;
  if(scope.team) return ex.team===scope.team;
  return teamTribe(ex.team)===scope.tribe;
}
function budgetBaseEffort(it,scope=budgetScope()){
  return issueExecutors(it).reduce((sum,ex)=>{
    if(!budgetBaseExecutor(ex,scope)) return sum;
    const comps=ex.comps||{};
    return sum+BUDGET_COMPS.reduce((s,c)=>s+budgetCompValue(comps,c),0);
  },0);
}
function budgetBaseComp(it,comp,scope=budgetScope()){
  return issueExecutors(it).reduce((sum,ex)=>sum+(budgetBaseExecutor(ex,scope)?budgetCompValue(ex.comps,comp):0),0);
}
function budgetAttractionRows(rows,scope=budgetScope()){
  if(!scope.tribe && !scope.team) return [];
  const map=new Map();
  rows.forEach(r=>issueExecutors(r.it).forEach(ex=>{
    if(budgetBaseExecutor(ex,scope)) return;
    const team=ex.team||'—';
    const tr=teamTribe(team);
    if(!tr) return;
    const key=tr+'||'+team;
    if(!map.has(key)) map.set(key,{tribe:tr,team,eff:0});
    map.get(key).eff+=BUDGET_COMPS.reduce((s,c)=>s+budgetCompValue(ex.comps,c),0);
  }));
  return [...map.values()].sort((a,b)=>a.tribe.localeCompare(b.tribe,'ru')||a.team.localeCompare(b.team,'ru'));
}

function saveBudgetInitiativeModal(rec){
  const it=rec.it,a=rec.a;
  ['id','name','description','product','owner','type'].forEach(k=>{
    const el=$('#bm_'+k); if(el) it[k]=el.value;
  });
  if($('#bm_status')) a.status=$('#bm_status').value;
  if($('#bm_finCategory')) a.finCategory=$('#bm_finCategory').value;
  if($('#bm_finEffect')) a.finEffect=num($('#bm_finEffect').value);
  if($('#bm_finMethod')) a.finMethod=$('#bm_finMethod').value;
  if($('#bm_valueDescription')) a.valueDescription=$('#bm_valueDescription').value;
  if($('#bm_comment')) a.comment=$('#bm_comment').value;
  if(rec.kind==='vendor'){
    ['vendor','workDescription'].forEach(k=>{ const el=$('#bm_'+k); if(el) a[k]=el.value; });
    if($('#bm_capex')) a.capex=num($('#bm_capex').value);
    if($('#bm_opex')) a.opex=num($('#bm_opex').value);
    ensureVendorShape(it);
  }else{
    if(!state.ui.budgetInitiativeSheMode){
      issueExecutors(it).forEach((ex,ei)=>{
        const team=$('#bm_exec_'+ei); if(team) ex.team=team.value;
        ex.comps=ex.comps||{};
        BUDGET_COMPS.forEach(c=>{ const el=$('#bm_comp_'+ei+'_'+c); if(el) ex.comps[c]=num(el.value); });
      });
    }
    if(rec.kind==='legacy-vadarod') ensureBacklogShape(it); else ensureBudgetInitiativeShape(it);
    ensureAssessmentShape(a);
  }
  const target=budgetIssueLinksTarget(rec);
  ensureIssueLinksShape(target);
  target.issueLinks.forEach((l,i)=>{
    const id=$('#bm_link_id_'+i); if(id) l.id=id.value;
    const total=$('#bm_link_total_'+i); if(total) l.totalEffort=num(total.value);
    const team=$('#bm_link_team_'+i); if(team) l.team=team.value;
    l.comps=l.comps||{};
    BUDGET_COMPS.forEach(c=>{ const el=$('#bm_link_comp_'+i+'_'+c); if(el) l.comps[c]=num(el.value); });
  });
}
function deleteBudgetRecord(rec){
  const b=budgetData();
  if(rec.kind==='vendor'){
    const ix=b.vendorRows.findIndex(x=>x._uid===rec.key); if(ix>=0) b.vendorRows.splice(ix,1);
  }else if(rec.kind==='legacy-vadarod'){
    delete b.assessments[rec.key];
  }else{
    const ix=b.vadarodInitiatives.findIndex(x=>x._uid===rec.key); if(ix>=0) b.vadarodInitiatives.splice(ix,1);
  }
}
function openBudgetInitiativeModal(key,kind){
  let rec=budgetRecordByKey(kind,key); if(!rec) return;
  if(rec.kind!=='vendor') budgetEnsureRecordExecutors(rec);
  const root=$('#modalRoot');
  root.innerHTML=budgetModalHTML(rec);
  const rerender=()=>{ rec=budgetRecordByKey(rec.kind,key); root.innerHTML=budgetModalHTML(rec); bindBudgetInitiativeModal(rec,key,rerender); };
  bindBudgetInitiativeModal(rec,key,rerender);
}
function bindBudgetInitiativeModal(rec,key,rerender){
  const root=$('#modalRoot');
  $('#bm_cancel').onclick=()=>root.innerHTML='';
  $('#bm_save').onclick=()=>{ saveBudgetInitiativeModal(rec); save(); root.innerHTML=''; render(); };
  $('#bm_delete').onclick=()=>{ deleteBudgetRecord(rec); save(); root.innerHTML=''; render(); };
  const she=$('#bm_she_mode'); if(she)she.onchange=()=>{ saveBudgetInitiativeModal(rec); state.ui.budgetInitiativeSheMode=she.checked; save(); rerender(); };
  const addExec=$('#bm_add_exec'); if(addExec)addExec.onclick=()=>{ saveBudgetInitiativeModal(rec); rec.it.executors.push(makeBudgetExecutor(budgetFirstTeam())); save(); rerender(); };
  root.querySelectorAll('[data-bm-exec-del]').forEach(btn=>btn.onclick=()=>{ saveBudgetInitiativeModal(rec); rec.it.executors.splice(+btn.dataset.bmExecDel,1); if(!rec.it.executors.length) rec.it.executors.push(makeBudgetExecutor(budgetFirstTeam())); save(); rerender(); });
  const addLink=$('#bm_add_link'); if(addLink)addLink.onclick=()=>{ saveBudgetInitiativeModal(rec); const t=budgetIssueLinksTarget(rec); t.issueLinks.push(ensureIssueLinkShape({team:budgetFirstTeam()})); save(); rerender(); };
  root.querySelectorAll('[data-bm-link-del]').forEach(btn=>btn.onclick=()=>{ saveBudgetInitiativeModal(rec); const t=budgetIssueLinksTarget(rec); t.issueLinks.splice(+btn.dataset.bmLinkDel,1); save(); rerender(); });
  const calc=$('#bm_calc_effect'); if(calc)calc.onclick=()=>toast('Расчет финансового эффекта заполняется вручную',{type:'info',title:'Фин. эффект'});
}
function compTotal(row){ return BUDGET_COMPS.reduce((s,c)=>s+(+row[c]||0),0); }
function approvedBudgetItems(){
  return budgetAssessmentItems().filter(r=>r.a.status==='Одобрена');
}
function vadarodPlanByTeam(){
  const b=budgetData();
  const wd=budgetWorkdaysTotal(b);
  const map=new Map();
  approvedBudgetItems().forEach(r=>{
    issueExecutors(r.it).forEach(ex=>{
      if(!budgetTeamByName(ex.team)) return;
      const team=ex.team||'—';
      const tribe=teamTribe(team)||r.tribe||'—';
      const key=tribe+'||'+team;
      if(!map.has(key)) map.set(key,{tribe,team,comps:emptyBudgetComps()});
      const rec=map.get(key);
      BUDGET_COMPS.forEach(c=>{ rec.comps[c]+=wd ? budgetCompValue(ex.comps,c)/wd : 0; });
    });
  });
  return map;
}
function budgetCompositionDate(b){
  if(state.ui.budgetCompositionDate) return state.ui.budgetCompositionDate;
  const latest=latestVadarodSnapshot(b);
  return latest ? latest.date : (b.vadarodSnapshotDate || todayISO());
}
function currentVadarodRowsForDate(b,date){
  const snap=selectedVadarodSnapshot(b,date);
  return cloneVadarodRows(snap ? snap.rows : b.vadarodRows);
}
function vadarodCompositionRows(){
  const b=budgetData();
  syncVadarodRows(b);
  const date=budgetCompositionDate(b);
  const current=currentVadarodRowsForDate(b,date);
  const plan=vadarodPlanByTeam();
  const map=new Map();
  current.forEach(r=>{
    const key=vadarodRowKey(r);
    map.set(key,{tribe:r.tribe||'—',team:r.team||'—',current:cloneVadarodRows([r])[0],plan:emptyBudgetComps(),vac:emptyBudgetComps()});
  });
  plan.forEach((p,key)=>{
    if(!map.has(key)){
      const row={tribe:p.tribe,team:p.team}; BUDGET_COMPS.forEach(c=>row[c]=0);
      map.set(key,{tribe:p.tribe,team:p.team,current:row,plan:emptyBudgetComps(),vac:emptyBudgetComps()});
    }
    map.get(key).plan=p.comps;
  });
  map.forEach(r=>{
    BUDGET_COMPS.forEach(c=>{ r.vac[c]=(+r.plan[c]||0)-(+r.current[c]||0); });
  });
  return [...map.values()].sort((a,b)=>a.tribe.localeCompare(b.tribe,'ru')||a.team.localeCompare(b.team,'ru'));
}
function aggregateCompositionByTribe(rows){
  const map=new Map();
  rows.forEach(r=>{
    if(!map.has(r.tribe)) map.set(r.tribe,{tribe:r.tribe,current:emptyBudgetComps(),plan:emptyBudgetComps(),vac:emptyBudgetComps()});
    const rec=map.get(r.tribe);
    addBudgetComps(rec.current,r.current);
    addBudgetComps(rec.plan,r.plan);
    addBudgetComps(rec.vac,r.vac);
  });
  return [...map.values()].sort((a,b)=>a.tribe.localeCompare(b.tribe,'ru'));
}
function totalCompositionRows(rows){
  return rows.reduce((acc,r)=>{
    addBudgetComps(acc.current,r.current);
    addBudgetComps(acc.plan,r.plan);
    addBudgetComps(acc.vac,r.vac);
    return acc;
  },{current:emptyBudgetComps(),plan:emptyBudgetComps(),vac:emptyBudgetComps()});
}
function metricClass(v,base){
  const n=+v||0;
  return `${base} ${n>0?'num-pos':(n<0?'num-neg':'num-zero')}`;
}
function compCells(row,cls='',opts={}){
  const base=opts.base||'';
  const start=opts.start?' group-start':'';
  return BUDGET_COMPS.map((c,i)=>`<td class="${cls} ${metricClass(row[c],base)}${i===0?start:''}">${fmtNum(row[c],2)}</td>`).join('')+
    `<td class="${cls} ${metricClass(compTotal(row),base)} strong-cell">${fmtNum(compTotal(row),2)}</td>`;
}

    <tr>${leading}<th class="group-head group-current group-start" colspan="6">Текущий состав <input class="head-date" id="bvtDateHead" type="date" value="${esc(date)}"></th><th class="group-head group-plan group-start" colspan="6">План, ШЕ</th><th class="group-head group-vac group-start" colspan="6">Вакансии, ШЕ</th></tr>
    <tr>${['metric-current','metric-plan','metric-vac'].map((base,gi)=>BUDGET_COMPS.map((c,i)=>`<th class="${base}${i===0?' group-start':''}">${c}</th>`).join('')+`<th class="${base}">Итого</th>`).join('')}</tr>
  </thead><tbody>
    ${body||`<tr><td colspan="${byTeams?20:19}" class="muted">Нет данных Vadarod.</td></tr>`}
    <tr class="total-row">${totalLead}${compCells(total.current,'total-lite',{base:'metric-current',start:true})}${compCells(total.plan,'total-lite',{base:'metric-plan',start:true})}${compCells(total.vac,'total-strong',{base:'metric-vac',start:true})}</tr>

}

function viewBudget(){
  const b=budgetData();
  const approved=budgetAssessmentItems().filter(r=>r.a.status==='Одобрена' && budgetOwnerInScope(r.it,{tribe:null,team:null}));
  const vMap=new Map();
  approved.forEach(r=>issueExecutors(r.it).forEach(ex=>{
    if(!budgetTeamByName(ex.team)) return;
    const tr=teamTribe(ex.team)||r.tribe;
    const key=tr+'||'+ex.team;
    if(!vMap.has(key)) vMap.set(key,{tribe:tr,team:ex.team,comps:{SA:0,DES:0,QA:0,FE:0,BE:0}});
    const row=vMap.get(key);
    BUDGET_COMPS.forEach(c=>row.comps[c]+=budgetCompValue(ex.comps,c));
  }));
  const vRows=[...vMap.values()];
  const vBody=vRows.map(r=>{
    const eff=BUDGET_COMPS.reduce((s,c)=>s+r.comps[c],0);
    return `<tr><td>${esc(r.tribe)}</td><td>${esc(r.team)}</td>${BUDGET_COMPS.map(c=>`<td>${fmtNum(budgetCompSHE(r.comps[c],b),3)}</td>`).join('')}<td>${fmtNum(budgetSHE(eff,b),3)}</td><td>${fmtMoneyK(budgetVadarodValue(eff,b))}</td></tr>`;
  }).join('');
  const vendorMap=new Map();
  const approvedVendor=budgetVendorItems().filter(r=>r.a.status==='Одобрена' && budgetOwnerInScope(r.it,{tribe:null,team:null}));
  approvedVendor.forEach(r=>{
    const vendor=r.a.vendor||'—';
    const key=(teamTribe(r.it.owner)||'—')+'||'+r.it.owner+'||'+vendor;
    if(!vendorMap.has(key)) vendorMap.set(key,{tribe:teamTribe(r.it.owner)||'—',team:r.it.owner,vendor,capex:0,opex:0});
    const row=vendorMap.get(key); row.capex+=(+r.a.capex||0); row.opex+=(+r.a.opex||0);

  const totalEff=vRows.reduce((s,r)=>s+BUDGET_COMPS.reduce((x,c)=>x+r.comps[c],0),0);
  const totalCapex=venRows.reduce((s,r)=>s+r.capex,0), totalOpex=venRows.reduce((s,r)=>s+r.opex,0);
  return `<div class="card budget-shell">
    <h2>Бюджет ${budgetBadge()}</h2>
    <h2 style="font-size:18px;margin-top:12px">Бюджет Vadarod</h2>
    <div class="budget-kpi"><span class="kpi">Итого ШЕ Vadarod: <b>${fmtNum(budgetSHE(totalEff,b),3)}</b></span><span class="kpi">Итого бюджет Vadarod, тыс. BYN: <b>${fmtMoneyK(budgetVadarodValue(totalEff,b))}</b></span></div>
    <div class="prep-wrap"><table><thead><tr><th>Трайб</th><th>Команда</th>${BUDGET_COMPS.map(c=>`<th>${c}, ШЕ</th>`).join('')}<th>Итого ШЕ Vadarod</th><th>Бюджет Vadarod, тыс. BYN</th></tr></thead><tbody>${vBody||`<tr><td colspan="${BUDGET_COMPS.length+4}" class="muted">Нет одобренных инициатив.</td></tr>`}</tbody></table></div>
    <h2 style="font-size:18px;margin-top:30px">Бюджет Vendor</h2>
    <div class="budget-kpi"><span class="kpi">Итого Vendor, тыс. BYN: <b>${fmtMoneyK(totalCapex+totalOpex)}</b></span><span class="kpi">Capex, тыс. BYN: <b>${fmtMoneyK(totalCapex)}</b></span><span class="kpi">Opex, тыс. BYN: <b>${fmtMoneyK(totalOpex)}</b></span></div>
    <div class="prep-wrap"><table><thead><tr><th>Трайб</th><th>Команда</th><th>Вендор</th><th>Capex, тыс. BYN</th><th>Opex, тыс. BYN</th><th>Итого, тыс. BYN</th></tr></thead><tbody>${venBody||'<tr><td colspan="6" class="muted">Нет одобренных инициатив с Vendor-бюджетом.</td></tr>'}</tbody></table></div>
  </div>`;
}

// Столбцы Pre PI — единые для обоих типов команд (Agile и «ИТ-проект»).
// Тип команды на набор столбцов не влияет: разница только в обязательности полей
// Обязательность полей приходит с backend в requiredFields.
//  upperOnly — только в верхнем блоке «Запланировано»;
//  lowerHide — скрыть в нижнем блоке «Бэклог инициатив».
const PREP_COLS=[
  {k:'cel',label:'Цель/Веха',sel:true},
  {k:'custPrio',label:'Приоритет заказчика'},
  {k:'teamPrio',label:'Приоритет трайба/команды'},
  {k:'product',label:'Продукт'},
  {k:'owner',label:'Команда-владелец',ro:true},
  {k:'type',label:'Тип инициативы'},
  {k:'metric',label:'Метрика',lowerHide:true},
  {k:'fact',label:'AS IS (текущее)',lowerHide:true},
  {k:'plan',label:'TO BE (прогноз)',lowerHide:true},
  {k:'hypo',label:'Гипотезы',lowerHide:true},
  {k:'redesign',label:'Редизайн',lowerHide:true},
];
// Набор столбцов блока (верхний/нижний). От типа команды не зависит.
function prepColsFor(isUpper){
  return PREP_COLS.filter(c=>(!c.upperOnly||isUpper) && (isUpper||!c.lowerHide));
}
function allTeamNames(){ return state.pi.teams.map(t=>t.name); }
function prepTeamObj(){
  if(!state.ui.prepSel) return null;
  return state.pi.teams.find(t=>t.name===state.ui.prepSel)||null;
}
// команды трайба и агрегация инициатив трайба (по командам-исполнителям)
function prepTribeTeams(tribe){ return state.pi.teams.filter(t=>t.tribe===tribe); }
function prepTribeBoardData(tribe,filter){
  const teamNames=prepTribeTeams(tribe).map(t=>t.name);
  const inScope=(i)=>{
    const et=issueExecTeams(i);
    return filter ? et.includes(filter) : et.some(n=>teamNames.includes(n));
  };
  const all=state.issues.filter(inScope);
  return {upper:all.filter(i=>i.prePlanned), lower:all.filter(i=>!i.prePlanned)};
}
// Команды трайба, по которым считаются блоки «Емкость / Доступность компетенций / Тех.повестка».
// Тип команды роли не играет: у «ИТ-проекта» тоже есть исполнители с компетенциями.
function prepCapTeams(tribe){ return prepTribeTeams(tribe); }
// Агрегат блоков «Емкость / Доступность компетенций / Тех.повестка» по набору команд.
// Одна команда — показатели этой команды; весь трайб — сумма по всем его командам-исполнителям.
// scope: 'team' — выбрана команда (с кнопкой «Рассчитать/изменить»); 'tribe' — весь трайб (без кнопки).
function prePiServerMetrics(teams,scope){
  const capacity=(prePiViews[currentCycleId()]||{}).capacity||{};
  if(scope==='team')return (capacity.teams||{})[teams[0]._teamId]||{};
  return (capacity.tribes||{})[teams[0]._tribeId]||{};
}
function prePiServerPercent(value){return value===null||value===undefined?'—':round1(value)+'%';}
function prePiCapacityPanelHTML(teams,scope){
  const d=prePiServerMetrics(teams,scope),competencies=d.competencies||{},tech=d.tech_agenda||{};
  const isTeam=scope==='team';
  return `<div class="cap-panel">
    <div class="cap-group">
      <div class="cap-group-head">
        <span class="cap-group-title">${isTeam?'Емкость команды':'Емкость трайба'}</span>
        ${isTeam?`<button class="cap-calc" id="prepCalc">Рассчитать/изменить</button>`:''}
      </div>
      <div class="cap-row">
        <div class="cap-box"><div class="cap-lab">Календарная</div><div class="cap-val">${round1(d.calendar_capacity||0)} дн.</div></div>
        <div class="cap-box"><div class="cap-lab">Доступная</div><div class="cap-val">${round1(d.available_capacity||0)} дн.</div></div>
        <div class="cap-box"><div class="cap-lab">Запланированная</div><div class="cap-val"><span class="fact ${d.over_capacity?'over':''}">${round1(d.planned_capacity||0)} дн.</span></div></div>
      </div>
    </div>
    <div class="cap-group cap-group-roles">
      <div class="cap-group-head"><span class="cap-group-title">Доступность компетенций</span></div>
      <div class="cap-row">`+
        Object.entries(competencies).map(([role,row])=>`<div class="cap-box"><div class="cap-lab">${role} · доступно | запланировано</div>
          <div class="cap-val">${round1(row.available||0)} | <span class="fact ${row.over_capacity?'over':''}">${round1(row.planned||0)}</span></div></div>`).join('')+
      `</div>
    </div>
    <div class="cap-group">
      <div class="cap-group-head"><span class="cap-group-title">Тех.повестка</span></div>
      <div class="cap-row">
        <div class="cap-box"><div class="cap-lab">Всего</div><div class="cap-val">${prePiServerPercent(tech.total_percent)}</div></div>
        <div class="cap-box"><div class="cap-lab">Общая</div><div class="cap-val">${prePiServerPercent(tech.common_percent)}</div></div>
        <div class="cap-box"><div class="cap-lab">Командная</div><div class="cap-val">${prePiServerPercent(tech.team_percent)}</div></div>
      </div>
    </div>
  </div>`;
}

function viewPrep(){
  const id=currentCycleId();
  if(!id||!prePiViews[id])return `<div class="card"><h2>Pre PI Planning ${cycleBadge()}</h2><div class="muted">${prePiApiReady?'Нет данных Pre PI':'Загрузка данных Pre PI…'}</div></div>`;
  if(!state.ui.prepTribe) return viewPrepSelect();
  if(!allTribes().includes(state.ui.prepTribe)){ state.ui.prepTribe=null; return viewPrepSelect(); }
  return viewPrepBoard(state.ui.prepTribe);
}
function viewPrepSelect(){
  const tribes=allTribes();
  let html=`<div class="card"><div class="flex-between"><h2>Pre PI Planning ${cycleBadge()}</h2>
    <div class="hint">Выберите трайб. Отобразится весь Pre PI трайба; сверху можно отфильтровать по команде.</div></div>`;
  html+=`<div class="tribe-list">`;
  if(!tribes.length) html+=`<div class="muted">Нет трайбов — добавьте команды на «Данные PI-цикла».</div>`;
  tribes.forEach(tribe=>{
    html+=`<div class="tribe-acc"><div class="tribe-acc-head" data-prep-tribe="${esc(tribe)}"><span class="caret">▶</span>${esc(tribe)}</div></div>`;
  });
  html+=`</div></div>`;
  return html;
}
function viewPrepBoard(tribe){
  const teams=prepTribeTeams(tribe);
  const filter=state.ui.prepTeamFilter;
  const filterTeam = filter ? teams.find(t=>t.name===filter) : null;
  const {upper,lower}=prepTribeBoardData(tribe,filter);

  let html=`<div class="card">
    <div class="prep-toolbar">
      <span class="team-title">${esc(tribe)}</span>
      <button class="ghost" id="prepBack">← Выбор трайба</button>
      <div class="prep-actions">
        <button class="primary" id="prepSubmit">Отправить на доски</button>
      </div>
    </div>`;
  // фильтр по командам трайба
  html+=`<div class="row" style="margin:8px 0;gap:6px;flex-wrap:wrap">
    <span class="muted">Команда:</span>
    <button class="bk-filter${!filter?' primary':''}" data-prep-filter="">Весь трайб</button>`+
    teams.map(t=>`<button class="bk-filter${filter===t.name?' primary':''}" data-prep-filter="${esc(t.name)}">${esc(t.name)}</button>`).join('')+
  `</div>`;

  // Блоки Емкость/Доступность/Тех.повестка: выбрана команда — по ней;
  // «Весь трайб» — сумма по всем командам трайба (включая «ИТ-проект»).
  if(!filterTeam){
    const capTeams=prepCapTeams(tribe);
    if(capTeams.length){
      html+=prePiCapacityPanelHTML(capTeams,'tribe');
      html+=`<div class="note" style="margin:8px 0">Показатели трайба — сумма по всем его командам-исполнителям (${capTeams.map(t=>esc(t.name)).join(', ')}). Выберите команду сверху, чтобы увидеть её показатели и рассчитать ёмкость.</div>`;
    }
  } else {
    html+=prePiCapacityPanelHTML([filterTeam],'team');
  }

  html+=goalDatalistHTML();
  html+=`<div class="prep-block">
    <div class="prep-block-title">Запланировано — верхний блок</div>
    ${prepTable(upper,true)}
  </div>`;
  html+=`<div class="prep-block">
    <div class="prep-block-title">Бэклог инициатив — нижний блок</div>
    ${prepTable(lower,false)}
  </div>`;
  html+=`<div class="note" style="margin-top:6px">Инициативы попадают в нижний блок с вкладки «Бэклог». Перетащите строку (за ручку <b>⠿</b> в столбце «№ Инициативы») из нижнего блока в верхний, чтобы «взять» инициативу; внутри блока перетаскивание меняет порядок строк. Кнопка <b>▼</b> в шапке столбца — фильтр и сортировка (пустые значения всегда внизу); пока сортировка активна, порядок внутри блока задаёт она, но перетаскивание между блоками работает. Крестик <b>✕</b> в верхнем блоке возвращает инициативу в нижний блок. «Общая оценка (чел/дн)» = сумма по всем командам-исполнителям и компетенциям. У каждого исполнителя — свои компетенции (из «Данных PI-цикла»). «Привлечение»: <b>+</b> добавляет ресурс другой команды с выбором спринта (фиолетовый — не согласовано, красный — согласовано).</div>`;
  html+=`</div>`;
  return html;
}
// «Цель/Веха» — комбобокс: варианты из справочника целей PI (state.pi.goals) плюс свободный ввод.
// Ручной ввод нужен командам «ИТ-проект» — веха у каждого проекта своя и в справочник не входит.
// Введённое вручную значение сохраняется у инициативы, но справочник целей не пополняет.
const GOAL_LIST_ID='piGoalsList';
// Общий на страницу список вариантов; подключается к полям через атрибут list.
function goalDatalistHTML(){
  return `<datalist id="${GOAL_LIST_ID}">`+
    (state.pi.goals||[]).map(g=>`<option value="${esc(g)}"></option>`).join('')+`</datalist>`;
}
function goalInputHTML(i){
  return `<input class="goal-sel" list="${GOAL_LIST_ID}" placeholder="цель или веха"
    title="Выберите цель из справочника PI или впишите свою (для ИТ-проектов — веху)"
    data-pi="${esc(i.id)}" data-pk="cel" value="${esc(i.cel)}">`;
}
// Фильтруемые столбцы Pre PI: все столбцы блока (кроме №/названия инициативы и
// «Команды-исполнителя и компетенций») + расчётная «Общая оценка».
function prepFilterCols(cols,withEffort){
  const fcols=cols.map(c=>({k:c.k,label:c.label}));
  if(withEffort) fcols.push({k:'effort',label:'Общая оценка (чел/дн)',val:i=>round1(i.totalEstimate||0)});
  return fcols;
}
function prepScope(isUpper){ return 'prep:'+(isUpper?'upper':'lower'); }

// Единая таблица инициатив (Agile и «ИТ-проект»): приоритеты, «Цель/Веха», метрика,
// AS IS / TO BE / Гипотезы / Редизайн, матрица компетенций по исполнителям, привлечение.
function prepTable(rows,isUpper){
  const cols=prepColsFor(isUpper);
  const scope=prepScope(isUpper);
  const fcols=prepFilterCols(cols,true);
  colFilterCtx[scope]={rows, cols:fcols};
  const hadRows=rows.length;
  rows=applyColFilters(rows,fcols,scope);
  rows=applyColSort(rows,fcols,scope);
  const sorted=!!colSort(scope); // влияет на подсказку у ручки перетаскивания
  const head=`<thead>
    <tr>
      <th class="stik1">№ Инициативы</th>
      <th class="stik2">Название инициативы</th>`+
      fcols.map(c=>filterThHTML(c,scope)).join('')+
      `<th>Команда-исполнитель и компетенции</th>`+
      (isUpper?`<th>Запросы на привлечение</th>`:``)+
      `<th class="del-col"></th>
    </tr>
  </thead>`;
  let body='';
  if(!rows.length){
    const msg = hadRows ? 'Ничего не найдено — измените фильтры по столбцам'
                        : (isUpper?'Перетащите инициативы сюда':'Инициативы переносятся сюда с вкладки «Бэклог»');
    body=`<tr><td class="stik1 muted">—</td><td class="stik2 muted">${msg}</td>`+
      cols.map(()=>`<td></td>`).join('')+`<td></td><td></td><td></td>`+(isUpper?`<td></td>`:``)+`</tr>`;
  }else{
    const opts=allTeamNames();
    rows.forEach(i=>{
      const exs=Array.isArray(i.executors)&&i.executors.length?i.executors:[{team:'',comps:{},attractions:[]}], span=exs.length;
      const lead=`
        <td class="stik1" rowspan="${span}"><div class="id-cell">
          <span class="row-drag" title="${sorted?'Перетащите, чтобы перенести в другой блок (порядок внутри блока задаёт сортировка)':'Перетащите, чтобы изменить порядок или перенести в другой блок'}">⠿</span>
          <b>${esc(i.id)}</b>
        </div></td>
        <td class="stik2" rowspan="${span}">${esc(i.name)||'<span class=auto>—</span>'}</td>`+
        cols.map(c=> c.ro
          ? `<td rowspan="${span}">${esc(i[c.k])||'<span class=auto>—</span>'}</td>`
          : c.sel
          ? `<td rowspan="${span}">${goalInputHTML(i)}</td>`
          : `<td rowspan="${span}"><input data-pi="${esc(i.id)}" data-pk="${c.k}" value="${esc(i[c.k])}" class="${c.k==='custPrio'||c.k==='teamPrio'?'w-narrow':''}"></td>`
        ).join('')+
        `<td rowspan="${span}" style="text-align:center;font-weight:700">${round1(i.totalEstimate||0)}</td>`;
      const delCell=`<td class="row-del-cell" rowspan="${span}">${rowDelBtnHTML(i.id,isUpper)}</td>`;
      exs.forEach((ex,ei)=>{
        const execCell=execBlockHTML(i, ex, ei, 'pi', opts);
        const attrCell=isUpper?`<td class="attr-cell" data-attr-row="${esc(i.id)}">${attractionsHTML(i, ei)}</td>`:'';
        body+=`<tr class="exec-row" ${ei===0?`draggable="true" data-rowdrag="${esc(i.id)}"`:''}>${ei===0?lead:''}${execCell}${attrCell}${ei===0?delCell:''}</tr>`;
      });
    });
  }
  return tableToolsBarHTML(scope)+
    `<div class="prep-wrap prep-dropzone" data-scroll-key="${scope}" data-prep-block="${isUpper?'upper':'lower'}"><table class="prep">${head}<tbody>${body}</tbody></table></div>`;
}
// «Крестик» строки: в верхнем блоке он возвращает инициативу в бэклог (нижний блок),
// в нижнем — удаляет её из PI-цикла.
function rowDelBtnHTML(id,isUpper){
  const title=isUpper?'Вернуть в бэклог инициатив':'Удалить инициативу';
  return `<button class="row-del" data-pi-delrow="${esc(id)}" data-pi-delblock="${isUpper?'upper':'lower'}" title="${title}">✕</button>`;
}
function attractionsHTML(iss, ei){
  const ex=iss.executors && iss.executors[ei];
  const list=(ex && ex.attractions) || [];
  let s=list.map(a=>{
    const aid=a.id;
    const col=a.visualState||({approved:'red',rejected:'gray'}[a.status]||'purple');
    const team=a.team||'—';
    const spr = (a.sprint!==null && a.sprint!==undefined) ? ` · Спринт ${(+a.sprint)+1}` : '';
    return `<span class="chip ${col}"><span class="chip-id">${esc(aid)}</span><span class="chip-team">${esc(team)}${spr}</span><span class="chip-x" data-attr-del="${esc(iss.id)}" data-attr-ei="${ei}" data-attr-aid="${esc(aid)}">✕</span></span>`;
  }).join('');
  s+=`<button class="attr-add" data-attr-add="${esc(iss.id)}" data-attr-ei="${ei}" title="Добавить привлечение">+</button>`;
  return s;
}

let prepDragId=null;
function prePiExecutorPayload(iss,mutate){
  const rows=(iss.executors||[]).map((ex,index)=>({
    id:ex._backendId||null,
    team_id:ex.teamId||null,
    team:ex.team||'',
    tribe:(state.pi.teams.find(t=>t.name===ex.team)||{}).tribe||'',
    effort_by_competency:{...(ex.comps||{})},
    attractions:(ex.attractions||[]).map((a,position)=>({
      id:a._backendId||null,target_initiative_id:a.targetInitiativeId||null,
      issue_key:a.id||'',target_team_id:a.targetTeamId||null,team:a.team||'',
      sprint_index:Number.isInteger(a.sprint)?a.sprint:null,
      approval_status:a.status||'pending',sort_order:position,
    })),
    sort_order:index,
  }));
  mutate(rows);
  return rows;
}
async function runPrePiUiCommand(path,method,body,successMessage){
  try{
    await prePiCommand(path,method,body);
    if(successMessage)toast(successMessage,{type:'success'});
  }catch(error){
    if(reportOptimisticConflict(error))return;
    reportPrePiSyncError(error);render();
  }
}
async function runPrePiCascadeCommand(path,method,body,successMessage){
  try{return await prePiCommand(path,method,body);}
  catch(error){
    if(error.detail&&error.detail.code==='cascade_confirmation_required'){
      if(window.confirm(error.detail.message||'Подтвердить каскадные изменения?')){
        return prePiCommand(path,method,{...body,confirm_cascade:true});
      }
      render();return null;
    }
    if(reportOptimisticConflict(error))return null;
    reportPrePiSyncError(error);render();return null;
  }finally{if(successMessage){} }
}
function bindPrep(){
  // выбор трайба (7.0-подобный экран для Pre PI); фильтры по столбцам сбрасываем
  document.querySelectorAll('[data-prep-tribe]').forEach(el=>el.onclick=()=>{
    state.ui.prepTribe=el.dataset.prepTribe; state.ui.prepTeamFilter=null;
    clearPrepColFilters(); save();render();
  });
  const tribe=state.ui.prepTribe;
  if(!tribe) return;
  bindColFilters();
  const back=$('#prepBack'); if(back)back.onclick=()=>{state.ui.prepTribe=null;clearPrepColFilters();save();render();};

  // фильтр по командам трайба (смена команды может сменить набор столбцов — Agile/ИТ-проект)
  document.querySelectorAll('[data-prep-filter]').forEach(el=>el.onclick=()=>{
    state.ui.prepTeamFilter=el.dataset.prepFilter||null; clearPrepColFilters(); save();render();
  });
  const filter=state.ui.prepTeamFilter;
  const teams=prepTribeTeams(tribe);
  const filterTeam=filter?teams.find(t=>t.name===filter):null;

  // «Рассчитать/изменить» ёмкость → Командные доски → Емкость выбранной команды
  const calc=$('#prepCalc'); if(calc && filterTeam)calc.onclick=()=>{
    state.ui.tab='teams'; state.ui.teamSel=filterTeam.name; state.ui.teamView='capacity';
    save();render();
  };

  // Каждое изменение — одна backend-команда; сохранённый read model до ответа не меняется.
  document.querySelectorAll('[data-pi]').forEach(el=>{
    let committedValue=el.value;
    const commit=()=>{
      if(el.value===committedValue)return;
      committedValue=el.value;
      const iss=findIssue(el.dataset.pi); if(!iss)return;
      const field={name:'title',description:'description',product:'product',type:'initiative_type',
        cel:'goal_text',metric:'metric',fact:'current_value',plan:'target_value',hypo:'hypothesis',
        redesign:'redesign',custPrio:'customer_priority',teamPrio:'team_priority',comment:'comment'}[el.dataset.pk];
      if(!field||!iss._backendId)return;
      runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{[field]:el.value});
    };
    el.onchange=commit;
    // Enter завершает редактирование так же, как уход из поля, и отправляет ровно одну команду.
    el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit();el.blur();}};
  });
  // выбор команды-исполнителя
  document.querySelectorAll('[data-pi-exec]').forEach(el=>el.onchange=()=>{
    const iss=findIssue(el.dataset.piExec); if(!iss)return;
    const ei=+el.dataset.ei,team=state.pi.teams.find(t=>t.name===el.value); if(!iss.executors[ei]||!team)return;
    const executors=prePiExecutorPayload(iss,rows=>{
      rows[ei].team_id=team._teamId;rows[ei].team=team.name;rows[ei].tribe=team.tribe;
      const allowed=new Set(team.comps||[]);
      rows[ei].effort_by_competency=Object.fromEntries(Object.entries(rows[ei].effort_by_competency).filter(([key])=>allowed.has(key)));
    });
    runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{executors});
  });
  // ввод чел/дн по компетенции
  document.querySelectorAll('[data-pi-comp]').forEach(el=>el.onchange=()=>{
    const iss=findIssue(el.dataset.piComp); if(!iss)return;
    const ei=+el.dataset.ei;if(!iss.executors[ei])return;
    const executors=prePiExecutorPayload(iss,rows=>{rows[ei].effort_by_competency[el.dataset.c]=+el.value||0;});
    runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{executors});
  });
  // добавить/убрать исполнителя
  document.querySelectorAll('[data-pi-execadd]').forEach(el=>el.onclick=()=>{
    const iss=findIssue(el.dataset.piExecadd);if(!iss)return;

    runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{executors});
  });
  document.querySelectorAll('[data-pi-execdel]').forEach(el=>el.onclick=()=>{
    const iss=findIssue(el.dataset.piExecdel);if(!iss)return;
    const ei=+el.dataset.ei,executors=prePiExecutorPayload(iss,rows=>rows.splice(ei,1));
    runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{executors});
  });

  // Крестик строки: из верхнего блока — возврат в бэклог инициатив, из нижнего — удаление.
  document.querySelectorAll('[data-pi-delrow]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id=el.dataset.piDelrow;
    if(el.dataset.piDelblock==='upper'){
      const iss=findIssue(id);if(iss)await runPrePiCascadeCommand(`/initiatives/${iss._backendId}/move`,'POST',{target_block:'backlog'});
      return;
    }
    const iss=findIssue(id);if(iss)await runPrePiCascadeCommand(`/initiatives/${iss._backendId}`,'DELETE',{});
  });

  // привлечение (по конкретному исполнителю)
  document.querySelectorAll('[data-attr-add]').forEach(b=>b.onclick=()=>openAttractionModal(b.dataset.attrAdd, +b.dataset.attrEi));
  document.querySelectorAll('[data-attr-del]').forEach(b=>b.onclick=()=>{
    const iss=findIssue(b.dataset.attrDel); if(!iss)return;
    const ex=iss.executors[+b.dataset.attrEi]; if(!ex)return;
    const ei=+b.dataset.attrEi;
    const executors=prePiExecutorPayload(iss,rows=>{rows[ei].attractions=rows[ei].attractions.filter(a=>a.issue_key!==b.dataset.attrAid);});
    runPrePiUiCommand(`/initiatives/${iss._backendId}`,'PATCH',{executors});
  });

  // drag строк
  bindPrepRowDrag();

  // отправка на доски: по выбранной команде, иначе по всем командам трайба
  const submit=$('#prepSubmit'); if(submit)submit.onclick=()=>{
    prepSubmitToBoards(filterTeam?[filterTeam]:teams);
  };
}
function bindPrepRowDrag(){
  document.querySelectorAll('tr[data-rowdrag]').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{
      // не начинаем перетаскивание, если тянут за поле/кнопку (чтобы работало редактирование)
      if(e.target.closest('input,select,button,.chip')){ e.preventDefault(); return; }
      prepDragId=tr.dataset.rowdrag;
      e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain',prepDragId);}catch(_){}
      tr.classList.add('dragging');
    });
    tr.addEventListener('dragend',()=>{tr.classList.remove('dragging');clearPrepRowDropMarkers();});
    tr.addEventListener('dragover',e=>{
      e.preventDefault();
      const after = isPrepDropAfter(tr,e);
      tr.classList.toggle('rowdragover-before',!after);
      tr.classList.toggle('rowdragover-after',after);
    });
    tr.addEventListener('dragleave',()=>clearPrepRowDropMarkers(tr));
    tr.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      clearPrepRowDropMarkers(tr);
      const block=tr.closest('[data-prep-block]').dataset.prepBlock;
      prepMoveRow(prepDragId,block,tr.dataset.rowdrag,isPrepDropAfter(tr,e));
    });
  });
  document.querySelectorAll('[data-prep-block]').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      if(e.target.closest('tr[data-rowdrag]')) return; // обработано строкой
      prepMoveRow(prepDragId,zone.dataset.prepBlock,null);
    });
  });
}
function isPrepDropAfter(tr,e){
  const rect=tr.getBoundingClientRect();
  return e.clientY > rect.top + rect.height/2;
}
function clearPrepRowDropMarkers(scope=document){
  if(scope.matches && scope.matches('.rowdragover-before,.rowdragover-after')){
    scope.classList.remove('rowdragover-before','rowdragover-after');
  }
  scope.querySelectorAll('.rowdragover-before,.rowdragover-after').forEach(x=>{
    x.classList.remove('rowdragover-before','rowdragover-after');
  });
}
function prepMoveRow(draggedId,block,targetId,afterTarget=false){
  if(!draggedId || targetId===draggedId) return;
  const dragged=findIssue(draggedId);if(!dragged||!dragged._backendId)return;
  const toUpper=(block==='upper');
  const blockChanged = dragged.prePlanned!==toUpper;
  const sorted=!!colSort(prepScope(toUpper));
  if(sorted && !blockChanged){ toast(SORT_DRAG_MSG,{type:'info'}); return; }
  let beforeId=null;
  if(targetId&&!sorted){
    const target=findIssue(targetId);beforeId=target&&target._backendId;
    if(afterTarget){
      const rows=state.issues.filter(i=>i.prePlanned===toUpper&&i.id!==draggedId);
      const index=rows.findIndex(i=>i.id===targetId);
      beforeId=rows[index+1]&&rows[index+1]._backendId||null;
    }
  }
  runPrePiCascadeCommand(`/initiatives/${dragged._backendId}/move`,'POST',{
    target_block:toUpper?'planned':'backlog',before_id:beforeId,
  });
}

// Подсветить незаполненные поля прямо в таблице (без ре-рендера — снимется при следующем render()).
function highlightMissingFields(problems){
  document.querySelectorAll('.prep .field-missing').forEach(el=>el.classList.remove('field-missing'));
  problems.forEach(p=>p.missing.forEach(m=>{
    const cell=document.querySelector(`.prep [data-pi="${CSS.escape(p.id)}"][data-pk="${m.k}"]`);
    if(cell) cell.classList.add('field-missing');
  }));
}
// Единая транзакционная отправка: backend повторно валидирует поля, создаёт цели,
// публикует инициативы на командных досках и отправляет привлечения.
async function prepSubmitToBoards(targets){
  targets=Array.isArray(targets)?targets:[targets];
  try{
    const id=currentCycleId(),backendId=cycleBackendIds[id];
    const result=await cycleMutation(id,`/pi-cycles/${backendId}/pre-pi/submit`,{
      method:'POST',body:{teams:targets.map(t=>({tribe:t.tribe,name:t.name}))},
    });
    const c=state.cycles[id];
    applyPrePi(c,result.pre_pi,id);
    applyGoals(c,result.goals,id);
    activateCycle(id);
    save();render();
    const parts=[];
    if(result.goals_added)parts.push(`целей: ${result.goals_added}`);
    if(result.board_added)parts.push(`стикеров на доску: ${result.board_added}`);
    if(result.attractions_added)parts.push(`на согласование: ${result.attractions_added}`);
    if(parts.length)toast(`Отправлено на доски — ${parts.join(', ')}`,{type:'success',title:'Отправлено на доски'});
    else toast('Новых данных для отправки нет — всё уже на досках',{type:'info'});
  }catch(error){
    if(reportOptimisticConflict(error))return;
    const serverProblems=error.detail&&Array.isArray(error.detail.problems)
      ? error.detail.problems.map(p=>({id:p.issue_key,missing:(p.missing||[]).map(m=>({k:m.key,label:m.label}))}))
      : [];
    if(serverProblems.length){
      highlightMissingFields(serverProblems);
      const lines=serverProblems.map(p=>`${p.id}: ${p.missing.map(m=>m.label).join(', ')}`).join('; ');
      toast(`Заполните обязательные поля — ${lines}`,{type:'warn',title:'Не все поля заполнены',duration:7000});
    }else{
      reportGoalsSyncError(error);
      toast(`Не удалось отправить данные на доски: ${error.message||error}`,{type:'warn'});
    }
  }
}

// «Цель» вынесена в заголовок группы (задаётся справочником, выбирается на Pre PI Planning),
// поэтому среди строковых столбцов её нет.
const GOAL_COLS=[
  ['product','Продукт'],['initNum','№ Инициативы'],['init','Инициатива'],
  ['metric','Метрика'],['fact','AS IS (текущее)'],['plan','TO BE (прогноз)'],['hypo','Гипотезы'],['redesign','Редизайн']
];
// Редактируемые на вкладке «Цели» столбцы (синхронизируются с Pre PI Planning).
const GOAL_EDIT=['metric','fact','plan','hypo','redesign'];
function legacyViewGoalsLocal(){
  const tribes=tribesForGoals();
  const tr=state.ui.goalsTribe && tribes.includes(state.ui.goalsTribe)?state.ui.goalsTribe:null;
  let html=`<div class="card"><h2>Цели ${cycleBadge()}</h2>`;
  if(!tribes.length){ html+=`<div class="muted">Нет трайбов без чекбокса. Снимите чекбокс на вкладке «Данные PI-цикла».</div></div>`; return html; }

  html+=`<div>`+tribes.map(t=>`<span class="pill tribe ${tr===t?'sel':''}" data-tribe="${esc(t)}">${esc(t)}</span>`).join('')+`</div>`;

  if(tr){
    const teams=teamsOfTribeForGoals(tr);
    const tm=state.ui.goalsTeam && teams.some(x=>x.name===state.ui.goalsTeam)?state.ui.goalsTeam:null;
    html+=`<div style="margin-top:6px">`+teams.map(t=>`<span class="pill ${tm===t.name?'sel':''}" data-team="${esc(t.name)}">${esc(t.name)}</span>`).join('')+`</div>`;

    if(tm){
      const key=teamKey(tr,tm);
      const rows=state.goals[key]||[];
      // Столбцы одинаковы для обоих типов команд — как и таблица на Pre PI.
      // Тип влияет только на подпись группы: Agile группируется по цели, ИТ-проект — по вехе.
      // Значение и там и там берётся из общего поля «Цель/Веха» (cel).
      const isIT=teamType(teams.find(x=>x.name===tm))==='ИТ-проект';
      const COLS=GOAL_COLS;
      const EDIT=GOAL_EDIT;
      // фолбэк на связанную инициативу — для строк, созданных до объединения полей
      const groupVal=g=>String(g.cel || (findIssue(g.initNum)||{}).cel || '');
      html+=`<div class="goals-wrap"><table class="goals"><thead><tr><th>№</th>`+
        COLS.map(c=>`<th>${c[1]}</th>`).join('')+`</tr></thead><tbody>`;
      const colCount=COLS.length+1; // +столбец «№»
      if(!rows.length){
        html+=`<tr><td colspan="${colCount}" class="muted">Целей пока нет — добавьте их на вкладке «Pre PI Planning» кнопкой «Отправить на доски».</td></tr>`;
      }else{
        // группировка инициатив: индексы строк по значению «Цель/Веха»
        const byGoal=new Map();
        rows.forEach((g,idx)=>{
          const gk=groupVal(g);
          if(!byGoal.has(gk)) byGoal.set(gk,[]);
          byGoal.get(gk).push(idx);
        });
        // порядок групп: сначала по справочнику целей; затем прочие непустые (в т.ч. вехи,
        // введённые вручную, — их в справочнике нет); пустая группа в конце
        const order=[];
        (state.pi.goals||[]).forEach(name=>{ if(byGoal.has(name)) order.push(name); });
        [...byGoal.keys()].forEach(k=>{ if(k && !order.includes(k)) order.push(k); });
        if(byGoal.has('')) order.push('');
        const emptyLabel=isIT?'Без вехи':'Без цели';
        const groupIcon=isIT?'🏁 ':'🎯 ';
        let n=0; // сквозная нумерация строк в порядке отображения
        order.forEach(gname=>{
          html+=`<tr class="goal-group"><td colspan="${colCount}">${gname?(groupIcon+esc(gname)):emptyLabel}</td></tr>`;
          byGoal.get(gname).forEach(idx=>{
            const g=rows[idx]; n++;
            html+=`<tr draggable="true" data-goaldrag="${idx}"><td><span class="g-handle" title="Перетащите, чтобы изменить порядок">⠿</span>${n}</td>`+
              COLS.map(c=> EDIT.includes(c[0])
                ? `<td><input data-goal-i="${idx}" data-goal-k="${c[0]}" value="${esc(g[c[0]])}"></td>`
                : `<td>${esc(g[c[0]])||'<span class=auto>—</span>'}</td>`
              ).join('')+`</tr>`;
          });
        });
      }
      html+=`</tbody></table></div>
      <div class="note" style="margin-top:14px">${isIT
        ? 'Инициативы сгруппированы по <b>вехам ИТ-проекта</b> — веха вписывается вручную в столбец «Цель/Веха» на «Pre PI Planning». Поля метрика / AS IS / TO BE / гипотезы / редизайн можно редактировать прямо здесь — изменения синхронизируются с «Pre PI Planning»; для ИТ-проектов они необязательны. Перетаскивайте строки за <b>⠿</b>, чтобы менять порядок.'
        : 'Инициативы сгруппированы по <b>Цели</b>. Цель выбирается у инициативы на «Pre PI Planning» из справочника («Данные PI-цикла») либо вводится вручную. Поля метрика / AS IS / TO BE / гипотезы / редизайн можно редактировать прямо здесь — изменения синхронизируются с «Pre PI Planning». Перетаскивайте строки за <b>⠿</b>, чтобы менять порядок.'}</div>`;
    }else{
      html+=`<div class="muted" style="margin-top:14px">Выберите команду.</div>`;
    }
  }else{
    html+=`<div class="muted" style="margin-top:14px">Выберите трайб.</div>`;
  }
  html+=`</div>`;
  return html;
}

function legacyMoveGoalLocal(key,from,targetIdx,after){
  if(from==null || from===undefined) return;
  const rows=state.goals[key]; if(!rows) return;
  if(from===targetIdx) return;
  const [item]=rows.splice(from,1);
  let insertAt = after ? targetIdx+1 : targetIdx;
  if(from < insertAt) insertAt--; // компенсируем сдвиг после удаления
  rows.splice(insertAt,0,item);
  save();render();
}

async function legacyMoveGoalCrud(fromId,targetId,after){
  if(!fromId||!targetId||fromId===targetId)return;

  if(from<0||target<0)return;

  ids.splice(insertAt,0,item);
