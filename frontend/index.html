function goalTeamBySelection(){
  const teams=goalTeamOptions();
  if(state.ui.goalsTeamId){
    const byId=teams.find(t=>String(t.id)===String(state.ui.goalsTeamId));
    if(byId)return byId;
  }
  return teams.find(t=>t.name===state.ui.goalsTeam && t.tribe===state.ui.goalsTribe)||null;
}
function selectedGoalTribe(){
  const tribes=goalTribeOptions();
  if(state.ui.goalsTribeId){
    const byId=tribes.find(t=>String(t.id)===String(state.ui.goalsTribeId));
    if(byId)return byId;
  }
  return tribes.find(t=>t.name===state.ui.goalsTribe)||null;
}
function goalGroupName(g){
  const issue=findIssue(g.initNum)||{};
  return String(g.cel||g.title||issue.cel||'');
}
function goalPatchForField(field,value){
  const map={metric:'metric',fact:'current_value',plan:'target_value',hypo:'hypothesis',redesign:'redesign'};
  return {[map[field]||field]:value};
}
function goalRowsForTeam(team){

}
function viewGoals(){

  let html=`<div class="card"><h2>Цели ${cycleBadge()}</h2>`;
  if(!goalsApiReady&&!goalsBoards[cycleId])return html+`<div class="muted">Загрузка целей с backend...</div></div>`;

  const tribes=goalTribeOptions();
  if(!tribes.length){
    return html+`<div class="muted">Нет трайбов и команд для целей. Добавьте их на вкладке «Данные PI-цикла».</div></div>`;
  }

  const tribe=selectedGoalTribe();

  }

  html+=`<div style="margin-top:6px">`+teams.map(t=>`<span class="pill ${teamId===String(t.id)?'sel':''}" data-goal-team-id="${esc(t.id)}" data-goal-team-name="${esc(t.name)}">${esc(t.name)}</span>`).join('')+`</div>`;

  if(!teamId){
    html+=`<div class="muted" style="margin-top:14px">Выберите команду.</div></div>`;
    return html;
  }

  const team=teams.find(t=>String(t.id)===teamId);

  const rows=goalRowsForTeam(team);
  const COLS=GOAL_COLS, EDIT=GOAL_EDIT;

    COLS.map(c=>`<th>${c[1]}</th>`).join('')+`</tr></thead><tbody>`;

  if(!rows.length){
    html+=`<tr><td colspan="${colCount}" class="muted">Целей пока нет — добавьте их на вкладке «Pre PI Planning» кнопкой «Отправить на доски».</td></tr>`;
  }else{
    const byGoal=new Map();
    rows.forEach(g=>{
      const key=goalGroupName(g);
      if(!byGoal.has(key))byGoal.set(key,[]);
      byGoal.get(key).push(g);
    });
    const order=[];
    (state.pi.goals||[]).forEach(name=>{if(byGoal.has(name))order.push(name);});
    [...byGoal.keys()].forEach(name=>{if(name&&!order.includes(name))order.push(name);});
    if(byGoal.has(''))order.push('');
    let n=0;
    const emptyLabel=isIT?'Без вехи':'Без цели';
    const groupIcon=isIT?'🏁 ':'🎯 ';
    order.forEach(group=>{
      html+=`<tr class="goal-group"><td colspan="${colCount}">${group?(groupIcon+esc(group)):emptyLabel}</td></tr>`;
      byGoal.get(group).forEach(g=>{
        n++;
        html+=`<tr draggable="true" data-goaldrag-id="${esc(g.id)}"><td><span class="g-handle" title="Перетащите, чтобы изменить порядок">⠿</span>${n}</td>`+
          COLS.map(c=>EDIT.includes(c[0])
            ? `<td><input data-goal-field-id="${esc(g.id)}" data-goal-k="${c[0]}" value="${esc(g[c[0]]||'')}"></td>`
            : `<td>${esc(g[c[0]]||'')||'<span class=auto>—</span>'}</td>`
          ).join('')+`</tr>`;
      });
    });
  }
  html+=`</tbody></table></div>
    <div class="note" style="margin-top:14px">${isIT
      ? 'Инициативы сгруппированы по <b>вехам ИТ-проекта</b> — веха вписывается вручную в столбец «Цель/Веха» на «Pre PI Planning». Поля метрика / AS IS / TO BE / гипотезы / редизайн можно редактировать прямо здесь — изменения синхронизируются с «Pre PI Planning»; для ИТ-проектов они необязательны. Перетаскивайте строки за <b>⠿</b>, чтобы менять порядок.'
      : 'Инициативы сгруппированы по <b>Цели</b>. Цель выбирается у инициативы на «Pre PI Planning» из справочника («Данные PI-цикла») либо вводится вручную. Поля метрика / AS IS / TO BE / гипотезы / редизайн можно редактировать прямо здесь — изменения синхронизируются с «Pre PI Planning». Перетаскивайте строки за <b>⠿</b>, чтобы менять порядок.'}</div></div>`;
  return html;
}

function bindGoalRowDrag(){
  let dragId=null;
  document.querySelectorAll('tr[data-goaldrag-id]').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{
      if(e.target.closest('input,button')){e.preventDefault();return;}
      dragId=tr.dataset.goaldragId;
      e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain',String(dragId));}catch(_){}
      tr.classList.add('dragging');
    });
    tr.addEventListener('dragend',()=>{tr.classList.remove('dragging');clearPrepRowDropMarkers();});
    tr.addEventListener('dragover',e=>{
      e.preventDefault();
      const after=isPrepDropAfter(tr,e);
      tr.classList.toggle('rowdragover-before',!after);
      tr.classList.toggle('rowdragover-after',after);
    });
    tr.addEventListener('dragleave',()=>clearPrepRowDropMarkers(tr));
    tr.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      clearPrepRowDropMarkers(tr);
      moveGoal(dragId,tr.dataset.goaldragId,isPrepDropAfter(tr,e));
    });
  });
}
async function moveGoal(fromId,targetId,after){
  if(!fromId||!targetId||fromId===targetId)return;
  const selected=goalTeamBySelection();
  const selectedIds=goalRowsForTeam(selected).map(g=>g.id);
  const from=selectedIds.indexOf(fromId),target=selectedIds.indexOf(targetId);
  if(from<0||target<0)return;
  const [item]=selectedIds.splice(from,1);
  let insertAt=after?target+1:target;
  if(from<insertAt)insertAt--;
  selectedIds.splice(insertAt,0,item);
  const selectedSet=new Set(selectedIds);
  let selectedIndex=0;
  const ids=goalRows().map(g=>selectedSet.has(g.id)?selectedIds[selectedIndex++]:g.id);
  try{await goalsBoardCommand('/order','PUT',{goal_ids:ids});toast('Порядок целей обновлён',{type:'success'});}
  catch(error){handleCommandError(error,()=>goalsBoardCommand('/order','PUT',{goal_ids:ids}));}
}

function pbTeamFilterOptions(){
  const seen=[];
  const add=name=>{
    const v=String(name||'').trim();
    if(v && !seen.includes(v)) seen.push(v);
  };
  (state.pi.teams||[]).forEach(t=>add(t.name));
  (state.issues||[]).forEach(i=>{
    add(i.owner);
    issueExecTeams(i).forEach(add);
  });
  return seen;
}
function pbFiltersActive(){
  return !!(state.ui.pbOwnerFilter || state.ui.pbExecutorFilter);
}
function issueMatchesPBFilters(iss){
  const owner=state.ui.pbOwnerFilter;
  const executor=state.ui.pbExecutorFilter;
  if(owner && iss.owner!==owner) return false;
  if(executor && !issueExecTeams(iss).includes(executor)) return false;
  return true;
}

// Сумма ёмкости подзадач по ролям (сколько уже разобрано декомпозицией)
function decompByRole(iss){
  const d={}; (iss.subtasks||[]).forEach(st=>{ d[st.role]=(d[st.role]||0)+(+st.cap||0); }); return d;
}
// Компетенции истории (чел/дн) — с миграцией со старых sa/dev/qa.
function storyComps(sy){
  if(sy.comps && typeof sy.comps==='object') return sy.comps;
  sy.comps={SA:+sy.sa||0,DEV:+sy.dev||0,QA:+sy.qa||0};
  return sy.comps;
}
function stickerHTML(iss,withDel,showDecomp,showTeams,extraClass){
  if(showTeams===undefined) showTeams=true;
  extraClass=extraClass?` ${extraClass}`:'';
  const tn=issuePrimaryTeam(iss);
  const comps=teamComps(tn);
  let decomp='';
  if(showDecomp){
    const subs=iss.subtasks||[];
    if(subs.length){
      const d=decompByRole(iss);
      const cell=r=>{
        const plan = issueTeamEffort(iss,tn,r);
        const done = d[r]||0;
        const cls = done>plan ? 'over' : (plan>0 && done>=plan ? 'ok' : 'under');
        return `<span class="${cls}">${r} ${round1(done)}/${round1(plan)}</span>`;
      };
      decomp=`<div class="deff" title="Разобрано декомпозицией / план по компетенциям">↳ разобрано: ${comps.map(cell).join(' · ')}</div>`;
    }else{
      decomp=`<div class="deff none">↳ не декомпозирована</div>`;
    }
  }
  return `<div class="sticker ${issueColor(iss)}${extraClass}" draggable="true" data-drag="issue" data-id="${esc(iss.id)}" data-sticker="${esc(iss.id)}" style="--lane:${issueHue(iss)}">
    ${withDel?`<span class="x" data-delissue="${esc(iss.id)}">✕</span>`:''}
    <div class="stid"><span class="lane-dot"></span>${esc(iss.id)}</div>
    ${issueTagsHTML(iss)}
    ${showTeams?issueTeamsHTML(iss):''}
    <div class="eff">${issueEffortLabel(iss)}</div>
    ${decomp}
  </div>`;
}

// Найти Историю задачи по uid
function storyById(iss,uid){ return (iss.stories||[]).find(s=>s.uid===uid)||null; }
// Сумма ёмкости белых подзадач конкретной Истории по ролям
function storyDecompByRole(iss,storyUid){
  const d={}; (iss.subtasks||[]).forEach(st=>{ if(st.storyUid===storyUid) d[st.role]=(d[st.role]||0)+(+st.cap||0); }); return d;
}
// Зелёный стикер «История»: свои компетенции + сводка разбора по белым.
function storyHTML(iss,sy){
  const hue=issueHue(iss);
  const tn=issuePrimaryTeam(iss);
  const comps=teamComps(tn);
  const sc=storyComps(sy);
  const hasSubs=(iss.subtasks||[]).some(st=>st.storyUid===sy.uid);
  let decomp;
  if(hasSubs){
    const d=storyDecompByRole(iss,sy.uid);
    const cell=r=>{
      const plan = +sc[r]||0;
      const done = d[r]||0;
      const cls = done>plan ? 'over' : (plan>0 && done>=plan ? 'ok' : 'under');
      return `<span class="${cls}">${r} ${round1(done)}/${round1(plan)}</span>`;
    };
    decomp=`<div class="deff" title="Разобрано декомпозицией / план по компетенциям">↳ разобрано: ${comps.map(cell).join(' · ')}</div>`;
  }else{
    decomp=`<div class="deff none">↳ не декомпозирована</div>`;
  }
  return `<div class="story" draggable="true" data-drag="story" data-id="${esc(iss.id)}" data-story-uid="${esc(sy.uid)}"
    data-story-issue="${esc(iss.id)}" data-story="${esc(sy.uid)}" style="--lane:${hue}">
    <span class="x" data-delstory-i="${esc(iss.id)}" data-delstory-u="${esc(sy.uid)}">✕</span>
    <div class="sparent">${esc(iss.id)}</div>
    <div class="stid">${esc(sy.id)||'История'}</div>
    ${sy.name?`<div class="sname">${esc(sy.name)}</div>`:''}
    <div class="eff">${comps.map(k=>`${k} ${+sc[k]||0}`).join(' · ')}</div>
    ${decomp}
  </div>`;
}
function bindPB(){
  const ownerFilter=$('#pbOwnerFilter');
  if(ownerFilter) ownerFilter.onchange=()=>{
    state.ui.pbOwnerFilter=ownerFilter.value||null;
    save(); render();
  };
  const executorFilter=$('#pbExecutorFilter');
  if(executorFilter) executorFilter.onchange=()=>{
    state.ui.pbExecutorFilter=executorFilter.value||null;
    save(); render();
  };
  const clear=$('#pbFilterClear');
  if(clear) clear.onclick=()=>{

  document.querySelectorAll('.pb-cell .sticker').forEach(el=>el.onclick=(e)=>{

        const ns = sprint==='backlog'?null:+sprint;
        if(iss.agreed && ns!==iss.sprint) iss.agreed=false; // перенос согласованного → сброс согласования
        setBoardPeriod(iss,ns,null); save(); render();
      }
    }
  }, '[data-pb-sprint]', el=>el.dataset.pbSprint);
}

/* ---- 4.x Трудозатраты по спринтам в разрезе ФИО (по кнопке, скрыто по умолчанию) ---- */
function effortByFioBlock(t){
  const on=!!state.ui.showEffortFio;
  let html=`<div class="row" style="margin-bottom:12px">
    <button class="effort-fio-btn${on?' primary':''}" id="tbEffortFio">${on?'Скрыть трудозатраты по ФИО':'Показать трудозатраты по ФИО'}</button>
    <span class="muted" style="margin-left:6px">Трудозатраты по каждому сотруднику в разрезе периодов доски — <b>факт / план</b> (дн.). Факт — сумма из белых подзадач; план — доступная ёмкость сотрудника (за вычетом отпусков, церемоний и рисков). Разница — остаток ресурса; красным выделен перегруз (факт &gt; план).</span>
  </div>`;
  if(!on) return html;
  const periods=boardPeriods();
  const key=teamKey(t.tribe,t.name);
  const roster=state.capacity[key]||[];
  // карта ФИО -> {role, per:[факт по периодам], total, plan:[план по периодам], planTotal, hasPlan}
  const map=new Map();
  const ensure=(fio,role)=>{
    const name=(fio||'').trim()||'— без ФИО —';
    if(!map.has(name)) map.set(name,{role:role||'',per:periods.map(()=>0),total:0,plan:periods.map(()=>0),planTotal:0,hasPlan:false});
    const rec=map.get(name);
    if(!rec.role && role) rec.role=role;
    return rec;
  };
  // сначала — сотрудники из ёмкости команды (чтобы видеть и тех, у кого пока нет задач)
  // и заодно посчитать план (доступную ёмкость) по каждому периоду
  roster.forEach(p=>{
    const rec=ensure(p.fio,p.role);
    rec.hasPlan=true;
    periods.forEach((period,idx)=>{ const av=personAvail(p,period); rec.plan[idx]+=av; rec.planTotal+=av; });
  });
  // затем — трудозатраты из белых подзадач
  state.issues.filter(i=>issuePrimaryTeam(i)===t.name && i.onBoard).forEach(i=>{
    (i.subtasks||[]).forEach(st=>{
      if(st.sprint===null || st.sprint===undefined) return;
      const rec=ensure(st.fio,st.role);
      const idx=periods.findIndex(p=>p.index===st.sprint && (p.week===null || itemWeek(st)===p.week));
      if(idx>=0){ rec.per[idx]+=(+st.cap||0); rec.total+=(+st.cap||0); }
    });
  });
  const rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
  const colTotals=periods.map(()=>0); let grand=0;
  const colPlan=periods.map(()=>0); let grandPlan=0;
  rows.forEach(([,rec])=>{
    rec.per.forEach((v,idx)=>colTotals[idx]+=v); grand+=rec.total;
    rec.plan.forEach((v,idx)=>colPlan[idx]+=v); grandPlan+=rec.planTotal;
  });
  // ячейка: факт / план, план серым; красным — если факт превысил план (перегруз)
  const cell=(fact,plan,hasPlan,extra='')=>{
    const ex=extra?' '+extra:'';
    if(!hasPlan) return `<td class="${fact?'':'zero'}${ex}"><span class="ef-fact">${round1(fact)}</span></td>`;
    const rem=plan-fact, over=rem<-1e-9;
    return `<td class="ef-cell${over?' over':''}${ex}" title="Осталось: ${round1(rem)} дн.">`+
      `<span class="ef-fact">${round1(fact)}</span><span class="ef-plan">/ ${round1(plan)}</span></td>`;
  };
  html+=`<div class="board-scroll" style="padding:0"><table class="effort-fio ef-planned"><thead><tr>
    <th>ФИО</th><th>Роль</th>`+
    periods.map(p=>`<th>${p.title}${p.subtitle?`<br><span class="muted">${p.subtitle}</span>`:''}</th>`).join('')+
    `<th>Итого</th></tr></thead><tbody>`;
  if(!rows.length){
    html+=`<tr><td colspan="${periods.length+3}" class="muted">Нет данных о трудозатратах</td></tr>`;
  }
  rows.forEach(([fio,rec])=>{
    html+=`<tr><td>${esc(fio)}</td><td class="muted">${esc(rec.role)}</td>`+
      rec.per.map((v,idx)=>cell(v,rec.plan[idx],rec.hasPlan)).join('')+
      cell(rec.total,rec.planTotal,rec.hasPlan,'tot')+
      `</tr>`;
  });
  html+=`</tbody><tfoot><tr><td colspan="2">Итого по команде (факт / план)</td>`+
    colTotals.map((v,idx)=>cell(v,colPlan[idx],true)).join('')+
    cell(grand,grandPlan,true,'tot')+
    `</tr></tfoot></table></div>`;
  return html;
}

    }).join('')+`</tbody></table></div></div>`;
    // тело: все стикеры (цветные + белые) одним плоским списком, свободный порядок по ord
    html+=`<div class="sprint-body dropzone" data-tb-sprint="${p.index}"${periodWeekAttr(p)}>`;
    const teamIssues=state.issues.filter(i=>issuePrimaryTeam(i)===t.name && i.onBoard);
    const cell=[];
    teamIssues.forEach(i=>{
      if(itemInBoardPeriod(i,p)) cell.push({ord:(i.ord??0), html:stickerHTML(i,true,true)});
      (i.stories||[]).forEach(sy=>{

/* ---- 4.x Доска команды: представление «Гант» (строка = ФИО, трудозатраты по спринтам) ---- */
function viewBoardGantt(t){
  const periods=boardPeriods();
  const key=teamKey(t.tribe,t.name);
  const roster=state.capacity[key]||[];
  const teamIssues=state.issues.filter(i=>issuePrimaryTeam(i)===t.name && i.onBoard);
  // карта ФИО -> {role, plan:[по периодам], cells:[ по периодам: [{iss,st,si,cap,hue}] ]}
  const map=new Map();
  const ensure=(fio,role)=>{
    const name=(fio||'').trim()||'— без ФИО —';
    if(!map.has(name)) map.set(name,{role:role||'',plan:periods.map(()=>0),cells:periods.map(()=>[])});
    const rec=map.get(name);
    if(!rec.role && role) rec.role=role;
    return rec;
  };
  // сотрудники из ёмкости (в т.ч. без задач) + план по периодам
  roster.forEach(p=>{
    const rec=ensure(p.fio,p.role);
    periods.forEach((period,idx)=>{ rec.plan[idx]+=personAvail(p,period); });
  });
  // белые подзадачи → сегменты трудозатрат в ячейке ФИО × период
  teamIssues.forEach(iss=>{
    const hue=issueHue(iss);
    (iss.subtasks||[]).forEach((st,si)=>{
      if(st.sprint===null || st.sprint===undefined) return;
      const idx=periods.findIndex(p=>p.index===st.sprint && (p.week===null || itemWeek(st)===p.week));
      if(idx<0) return;
      const rec=ensure(st.fio,st.role);
      rec.cells[idx].push({iss,st,si,cap:(+st.cap||0),hue});
    });
  });
  const rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));

  let html=`<div class="card">${teamToolbar(t,'board')}`;
  html+=boardSwitch();
  html+=effortByFioBlock(t);
  html+=`<div class="row" style="margin-bottom:10px">
    <span class="muted">Диаграмма Ганта трудозатрат: <b>строка — сотрудник (ФИО)</b>, столбцы — спринты. В каждой ячейке — <b>полоса загрузки</b> (заполнение — факт трудозатрат на фоне плановой ёмкости; сегменты окрашены по задачам, цвет = цвет задачи) и карточки подзадач сотрудника. <b style="color:var(--danger)">Красным</b> выделен перегруз (факт &gt; план). Белые карточки можно перетаскивать между спринтами <b>в пределах строки своего сотрудника</b>.</span>
  </div>`;
  html+=`<div class="board-scroll">`;
  html+=`<table class="lanes gantt"><thead><tr><th class="lane-id-head">ФИО</th>`;
  periods.forEach(p=>{
    html+=`<th class="lane-sp-head">${periodHeadHTML(p)}</th>`;
  });
  html+=`<th class="lane-sp-head gantt-tot-head"><div class="num">Итого</div></th></tr></thead><tbody>`;
  if(!rows.length){
    html+=`<tr><td class="lane-id"><span class="muted">Нет данных о сотрудниках</span></td>`+
      periods.map(()=>`<td class="lane-cell"></td>`).join('')+`<td class="lane-cell gantt-tot"></td></tr>`;
  }
  // полоса загрузки: сегменты по задачам на фоне плана; перегруз — красным
  const loadBar=(segs,plan)=>{
    const fact=segs.reduce((s,g)=>s+g.cap,0);
    const over=fact-plan>1e-9;
    const denom=Math.max(plan,fact,1e-9);
    const seg=segs.map(g=>`<span class="gseg" style="width:${(g.cap/denom*100)}%;background:${g.hue}" title="${esc(g.iss.id)}: ${round1(g.cap)} дн."></span>`).join('');
    // если план больше факта — остаток пустой дорожкой; если перегруз — вся дорожка факта
    return `<div class="gload${over?' over':''}" title="Факт ${round1(fact)} / План ${round1(plan)} дн.">
      <div class="gload-track">${seg}</div>
      <div class="gload-lbl"><span class="g-fact">${round1(fact)}</span><span class="g-plan">/ ${round1(plan)}</span></div>
    </div>`;
  };
  rows.forEach(([fio,rec])=>{
    html+=`<tr><td class="lane-id gantt-fio"><div class="lane-id-top"><b>${esc(fio)}</b></div>
      ${rec.role?`<div class="lane-id-status">${esc(rec.role)}</div>`:''}</td>`;
    let totPlan=0;
    rec.cells.forEach((segs,idx)=>{
      const plan=rec.plan[idx];
      totPlan+=plan;
      const period=periods[idx];
      html+=`<td class="lane-cell gantt-cell" data-tb-sprint="${period.index}"${periodWeekAttr(period)} data-tb-fio="${esc(fio)}">`+
        loadBar(segs,plan)+
        segs.map(g=>whiteGanttHTML(g.iss,g.st,g.si)).join('')+
        `</td>`;
    });
    html+=`<td class="lane-cell gantt-tot">`+loadBar(
      rec.cells.flat(), totPlan)+`</td></tr>`;
  });
  html+=`</tbody></table></div>
  <div class="legend">
    <span class="muted">Полоса в ячейке: цветные сегменты — трудозатраты по задачам (цвет = задача), длина ∝ дням; фон дорожки — плановая ёмкость сотрудника. «факт / план» — сумма и доступная ёмкость. Красная полоса — перегруз (факт &gt; план). Столбец «Итого» — суммарная загрузка за PI.</span>
  </div></div>`;
  return html;
}

  };

/* ---- Свободное размещение стикеров в колонках (drop по позиции) ---- */
// id цветного стикера, перед которым нужно вставить (по вертикали курсора), либо null (в конец).
// Ключ стикера (цветного/белого) под курсором, ПЕРЕД которым вставлять, либо null (в конец).
// Формат ключа: 'i:'+id (цветной) | 'g:'+uid (История) | 's:'+uid (белый).
function stickerBeforeKey(zone,clientY){
  const kids=[...zone.querySelectorAll(':scope > .sticker[data-drag="issue"], :scope > .story[data-story-uid], :scope > .white[data-wuid]')];
  for(const el of kids){
    const r=el.getBoundingClientRect();
    if(clientY < r.top + r.height/2){
      if(el.classList.contains('white')) return 's:'+el.dataset.wuid;
      if(el.classList.contains('story')) return 'g:'+el.dataset.storyUid;
      return 'i:'+el.dataset.id;
    }
  }
  return null;
}
// Плоский список стикеров колонки (цветные + Истории + белые), отсортированный по ord.
// sprintVal — индекс спринта или null (бэклог); weekVal — null для обычного режима или 0/1 для недель.
function boardColumnItems(teamName,sprintVal,weekVal=null){
  const out=[];
  const inPlace=item=>item && item.sprint===sprintVal && (weekVal===null || itemWeek(item)===weekVal);
  state.issues.filter(i=>issuePrimaryTeam(i)===teamName && i.onBoard).forEach(i=>{
    if(inPlace(i)) out.push({key:'i:'+i.id, ord:(i.ord??0), set:v=>{i.ord=v;}});
    (i.stories||[]).forEach(sy=>{
      if(inPlace(sy)) out.push({key:'g:'+sy.uid, ord:(sy.ord??0), set:v=>{sy.ord=v;}});
    });
    (i.subtasks||[]).forEach(st=>{
      if(inPlace(st)) out.push({key:'s:'+st.uid, ord:(st.ord??0), set:v=>{st.ord=v;}});
    });
  });
  out.sort((a,b)=>a.ord-b.ord);
  return out;
}
// Свободная перестановка любого стикера внутри колонки: перед beforeKey, либо в конец.
// dragKey/beforeKey — ключи 'i:'+id / 's:'+uid. Проставляет сквозной ord 0..n по колонке.
function reorderBoardItem(teamName,sprintVal,weekVal,dragKey,beforeKey){
  if(beforeKey===dragKey) return; // отпустили перед самим собой — без изменений
  const items=boardColumnItems(teamName,sprintVal,weekVal); // dragKey уже в колонке (sprint/week выставлены ранее)
  const di=items.findIndex(o=>o.key===dragKey); if(di<0) return;
  const [d]=items.splice(di,1);
  const bi = beforeKey ? items.findIndex(o=>o.key===beforeKey) : -1;
  if(bi>=0) items.splice(bi,0,d); else items.push(d);
  items.forEach((o,idx)=>o.set(idx));
}

  // --- Ёмкость ---
  const addCap=$('#addCap');if(addCap)addCap.onclick=()=>{
    const key=teamKey(t.tribe,t.name);state.capacity[key]=state.capacity[key]||[];
    state.capacity[key].push({fio:'',role:'SA',rate:1,vacation:'',extraUnavailable:'',ceremonyPct:0,riskPct:0,efficiency:''});save();render();
  };
  document.querySelectorAll('[data-ci]').forEach(el=>el.onchange=()=>{
    const key=teamKey(t.tribe,t.name);
    state.capacity[key][+el.dataset.ci][el.dataset.ck]=el.value;save();render();
  });
  // отпуск — открытие модального окна выбора дат
  document.querySelectorAll('[data-vacedit]').forEach(el=>el.onclick=()=>{
    openVacationModal(t,+el.dataset.vacedit);
  });
  document.querySelectorAll('[data-unavailedit]').forEach(el=>el.onclick=()=>{
    openExtraUnavailableModal(t,+el.dataset.unavailedit);
  });
  document.querySelectorAll('[data-delcap]').forEach(b=>b.onclick=()=>{
    const key=teamKey(t.tribe,t.name);state.capacity[key].splice(+b.dataset.delcap,1);save();render();
  });

  // --- Доска: удаление стикеров/подзадач, добавление подзадач, drag ---
  // Удаление стикера = снятие с доски + синхронизация с Pre PI Planning (5.1):
  //   голубой   → задача уходит из верхней зоны в нижнюю (prePlanned=false);
  //   красный   → согласование снимается (agreed=false) → снова фиолетовый;
  //   фиолетовый → остаётся фиолетовым.
  document.querySelectorAll('[data-delissue]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const i=findIssue(b.dataset.delissue); if(!i)return;
    const col=issueColor(i);
    i.onBoard=false; setBoardPeriod(i,null,null);
    if(col==='blue') i.prePlanned=false;
    if(col==='red')  i.agreed=false;
    save();render();
  });
  document.querySelectorAll('[data-delsub-i]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const iss=state.issues.find(i=>i.id===b.dataset.delsubI);
    if(iss){
      const st=iss.subtasks[+b.dataset.delsubS];
      if(st) state.connections=(state.connections||[]).filter(c=>
        !(c.from.kind==='w'&&c.from.uid===st.uid) && !(c.to.kind==='w'&&c.to.uid===st.uid));
      iss.subtasks.splice(+b.dataset.delsubS,1);
    }
    save();render();
  });
  // удаление Истории: снимаем и её белые подзадачи (со связями)
  document.querySelectorAll('[data-delstory-i]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const iss=state.issues.find(i=>i.id===b.dataset.delstoryI); if(!iss)return;
    const su=b.dataset.delstoryU;
    const childUids=(iss.subtasks||[]).filter(st=>st.storyUid===su).map(st=>st.uid);
    state.connections=(state.connections||[]).filter(c=>
      !(c.from.kind==='w'&&childUids.includes(c.from.uid)) && !(c.to.kind==='w'&&childUids.includes(c.to.uid)));
    iss.subtasks=(iss.subtasks||[]).filter(st=>st.storyUid!==su);
    iss.stories=(iss.stories||[]).filter(s=>s.uid!==su);
    save();render();
  });
  // клик по стикеру -> карточка (поля + Согласовать для фиолетовых + декомпозиция)
  document.querySelectorAll('#boardScroll .sticker').forEach(el=>el.onclick=(e)=>{
    if(e.target.classList.contains('x'))return;
    if(el.classList.contains('info'))return;
    openStickerModal(el.dataset.id);
  });
  // клик по зелёному стикеру Истории -> карточка Истории (поля + декомпозиция на белые)
  document.querySelectorAll('#boardScroll .story').forEach(el=>el.onclick=(e)=>{
    if(e.target.classList.contains('x'))return;
    openStoryModal(el.dataset.storyIssue, el.dataset.storyUid);
  });
  // клик по белой подзадаче -> карточка редактирования (ФИО/роль/ёмкость/спринт)
  document.querySelectorAll('#boardScroll .white').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.x,.w-link'))return; // ✕ удаляет, «+ связь» создаёт связь
    openWhiteModal(el.dataset.wissue, +el.dataset.wsub);
  });
  // клик по пустому месту доски -> снять выделение стрелки
  const bsEl=$('#boardScroll');
  if(bsEl) bsEl.addEventListener('click',(e)=>{
    if(e.target.closest('.sticker,.white,.story,[data-arrow],.arrow-handle'))return;
    if(state.ui.selectedArrow){ state.ui.selectedArrow=null; save(); render(); }
  });

  // переключатель вида доски (Колонки / Дорожки)
  document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{
    state.ui.boardLayout=b.dataset.layout; save(); render();
  });
  // переключатель детализации доски (спринты / недели)
  document.querySelectorAll('[data-week-mode]').forEach(b=>b.onclick=()=>{
    state.ui.boardWeeks=b.dataset.weekMode==='on'; save(); render();
  });
  // переключатель таблицы трудозатрат по ФИО
  const effFio=$('#tbEffortFio');
  if(effFio) effFio.onclick=()=>{ state.ui.showEffortFio=!state.ui.showEffortFio; save(); render(); };

  // drag для доски (цветные + белые); zone — сама зона, чтобы знать строку в режиме дорожек
  enableDrag(document,(payload,zone,ev)=>{
    const target=zone.dataset.tbSprint;
    const targetWeek=zone.dataset.tbWeek==='' || zone.dataset.tbWeek===undefined ? null : +zone.dataset.tbWeek;
    const cellIssue=zone.dataset.tbIssue; // задаётся только в режиме «Дорожки»
    const cellFio=zone.dataset.tbFio; // задаётся только в режиме «Гант»
    const isColumns = cellIssue===undefined && cellFio===undefined; // «Колонки» (у «Дорожек» есть data-tb-issue, у «Ганта» — data-tb-fio)
    if(payload.kind==='issue'){
      const iss=state.issues.find(i=>i.id===payload.id);
      if(iss){
        const ns=target==='backlog'?null:+target;
        // перенос согласованного (красного) стикера в другой спринт сбрасывает согласование → снова фиолетовый
        if(iss.agreed && ns!==iss.sprint) iss.agreed=false;
        setBoardPeriod(iss,ns,targetWeek);
        // «Колонки»: свободное размещение среди всех стикеров колонки (цветных и белых)
        if(isColumns && ev){
          const beforeKey=stickerBeforeKey(zone,ev.clientY);
          reorderBoardItem(t.name,ns,targetWeek,'i:'+iss.id,beforeKey);
        }
        save();render();
      }
    }else if(payload.kind==='story'){
      if(target==='backlog')return; // Истории в бэклог не уходят
      // в режиме дорожек История остаётся в строке своей задачи
      if(cellIssue!==undefined && cellIssue!=='' && cellIssue!==payload.id){
        toast('Историю можно переносить только в пределах строки своей задачи',{type:'warn'}); return;
      }
      const iss=state.issues.find(i=>i.id===payload.id);
      const sy=iss?storyById(iss,payload.story):null;
      if(sy){
        setBoardPeriod(sy,+target,targetWeek);
        if(isColumns && ev){
          const beforeKey=stickerBeforeKey(zone,ev.clientY);
          reorderBoardItem(t.name,+target,targetWeek,'g:'+sy.uid,beforeKey);
        }
        save();render();
      }
    }else if(payload.kind==='sub'){
      if(target==='backlog')return; // белые в бэклог не уходят
      // в режиме дорожек белый остаётся в строке своей задачи
      if(cellIssue!==undefined && cellIssue!=='' && cellIssue!==payload.id){
        toast('Подзадачу можно переносить только в пределах строки своей задачи',{type:'warn'}); return;
      }
      const iss=state.issues.find(i=>i.id===payload.id);
      if(iss&&iss.subtasks[payload.sub]){
        const st=iss.subtasks[payload.sub];
        // в режиме «Гант» белый остаётся в строке своего сотрудника
        if(cellFio!==undefined){
          const stFio=(st.fio||'').trim()||'— без ФИО —';
          if(stFio!==cellFio){ toast('Подзадачу можно переносить только в пределах строки своего сотрудника',{type:'warn'}); return; }
        }
        setBoardPeriod(st,+target,targetWeek);
        // «Колонки»: свободное размещение среди всех стикеров колонки (цветных и белых)
        if(isColumns && ev){
          const beforeKey=stickerBeforeKey(zone,ev.clientY);
          reorderBoardItem(t.name,+target,targetWeek,'s:'+st.uid,beforeKey);
        }
        save();render();
      }
    }
  },'[data-tb-sprint]',zone=>zone);

  // стрелки + фокус по наведению
  const scroll=$('#boardScroll');
  if(scroll){
    scroll.querySelectorAll('.sticker[data-id],.white[data-wissue],.story[data-story-uid]').forEach(el=>{
      // Режим подсветки по наведению:
      //  задача        → 'issue'  (всё дерево задачи: Истории + все белые);
      //  История       → 'story'  (сама История + её белые + задача-родитель);
      //  белый Истории → 'story'  (та же ветка Истории);
      //  прямой белый  → 'direct' (задача-родитель + только её прямые белые, без Историй).
      const issueId = el.dataset.id || el.dataset.wissue || el.dataset.storyIssue;
      let mode='issue', storyUid=null;
      if(el.classList.contains('story')){ mode='story'; storyUid=el.dataset.storyUid; }
      else if(el.classList.contains('white')){
        if(el.dataset.story){ mode='story'; storyUid=el.dataset.story; }
        else mode='direct';
      }
      el.addEventListener('mouseenter',()=>setBoardFocus(issueId,mode,storyUid));
      el.addEventListener('mouseleave',()=>setBoardFocus(null));
    });
    // создание новой связи: зажать «+ связь» на стикере и потянуть на цель
    scroll.querySelectorAll('[data-link-key]').forEach(b=>b.addEventListener('mousedown',(e)=>{
      e.preventDefault(); e.stopPropagation();
      const kind=b.dataset.linkKind, key=b.dataset.linkKey;
      const from = kind==='c' ? {kind:'c',id:key} : {kind:'w',uid:key};
      const srcEl = kind==='c'
        ? scroll.querySelector(`.sticker[data-sticker="${CSS.escape(key)}"]`)
        : scroll.querySelector(`.white[data-wuid="${CSS.escape(key)}"]`);
      arrowDrag={create:true, from, anchor: srcEl?elCenterInScroll(scroll,srcEl):{x:0,y:0}};
      document.addEventListener('mousemove',onArrowMove);
      document.addEventListener('mouseup',onArrowUp);
    }));
    requestAnimationFrame(drawArrows);
    scroll.onscroll=drawArrows;
    window.onresize=drawArrows;
  }
  // удаление выбранной стрелки клавишей Delete / Backspace
  document.onkeydown=(e)=>{
    if(state.ui.tab!=='teams' || !state.ui.selectedArrow) return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteConnection(state.ui.selectedArrow); }
  };
}

/* ---- Карточка стикера (поля + Согласовать + декомпозиция) ---- */
function openStickerModal(issueId){
  const iss=findIssue(issueId); if(!iss)return;
  const isAttr = issuePrimaryTeam(iss)!==iss.owner; // привлечение
  const tn=issuePrimaryTeam(iss);
  const comps=teamComps(tn);
  const ec=execComps(iss,tn);
  const tags=piTags();
  const selectedTags=issueTags(iss);
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal">
    <h3>${esc(iss.id)} <span class="muted" style="font-size:12px;font-weight:400">(${COLOR_RU[issueColor(iss)]})</span></h3>
    <label><span>Название инициативы</span><input id="sm_name" value="${esc(iss.name)}"></label>
    <div class="muted" style="margin-bottom:12px">Владелец: <b>${esc(iss.owner)}</b> · Исполнитель: <b>${esc(issueExecTeams(iss).join(', '))||esc(iss.executor)}</b></div>
    <div>
      <span class="muted" style="display:block;margin-bottom:5px;font-size:12.5px">Тэги</span>
      ${tags.length
        ? `<div class="tag-picker">${tags.map(t=>`<label class="tag-check"><input type="checkbox" data-sm-tag value="${esc(t)}" ${selectedTags.includes(t)?'checked':''}>#${esc(t)}</label>`).join('')}</div>`
        : `<div class="muted" style="font-size:12px;margin-bottom:14px">Сначала добавьте тэги на вкладке «Данные PI-цикла».</div>`}
    </div>
    <div class="row" style="gap:8px">
      ${comps.map(r=>`<label style="display:flex;flex-direction:column;gap:3px"><span class="muted" style="font-size:11px">${r}</span><input type="number" min="0" style="width:70px" id="sm_${r.toLowerCase()}" value="${esc(+ec[r]||0)}"></label>`).join('')}
    </div>
    <label style="margin-top:12px"><span>Тип инициативы</span><input id="sm_type" value="${esc(iss.type)}"></label>
    <label><span>Комментарий</span><input id="sm_comment" value="${esc(iss.comment)}"></label>
    ${isAttr ? (iss.agreed
        ? `<div class="note" style="margin:6px 0;border-left-color:var(--red-b)">✓ Привлечение <b>согласовано</b>. Перенос стикера в другой спринт сбросит согласование.</div>`
        : `<div class="note" style="margin:6px 0;border-left-color:var(--purple-b)">Привлечение <b>не согласовано</b> (фиолетовый). Нажмите «Согласовать».</div>`)
      : ''}
    <div class="note" style="margin:6px 0">Задачу можно декомпозировать <b>двумя способами</b>: сразу на белые подзадачи или на <b>Истории</b> (зелёные), а каждую Историю — уже на белые. Истории и белые на Program Board не выносятся.</div>
    <div class="modal-actions" style="justify-content:space-between">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${isAttr && !iss.agreed ? `<button class="primary" id="sm_approve">Согласовать</button>`:''}
        <button id="sm_story">Добавить историю</button>
        <button id="sm_decomp">Добавить подзадачу</button>
      </div>
      <button id="sm_close">Закрыть</button>
    </div>
  </div></div>`;
  const sync=()=>{
    iss.name=$('#sm_name').value; iss.type=$('#sm_type').value; iss.comment=$('#sm_comment').value;
    iss.tags=[...root.querySelectorAll('[data-sm-tag]:checked')].map(el=>el.value);
    let entry=execEntry(iss,tn);
    if(!entry){ entry={team:tn,comps:{}}; iss.executors=iss.executors||[]; iss.executors.push(entry); }
    entry.comps=entry.comps||{};
    comps.forEach(r=>{ entry.comps[r]=+$('#sm_'+r.toLowerCase()).value||0; });
  };
  root.querySelectorAll('[data-sm-tag]').forEach(el=>el.onchange=(e)=>{
    e.stopPropagation();
    iss.tags=[...root.querySelectorAll('[data-sm-tag]:checked')].map(x=>x.value);
    save();
  });
  const tagPick=root.querySelector('.tag-picker');
  if(tagPick) tagPick.onclick=e=>e.stopPropagation();
  $('#sm_close').onclick=()=>{ sync(); root.innerHTML=''; save(); render(); };
  const ap=$('#sm_approve'); if(ap)ap.onclick=()=>{ sync(); iss.agreed=true; root.innerHTML=''; save(); render(); };
  $('#sm_decomp').onclick=()=>{ sync(); save(); openSubtaskModal(iss.id); };
  $('#sm_story').onclick=()=>{ sync(); save(); openStoryModal(iss.id, null); };
}

/* ---- Модальное окно подзадачи ---- */
// storyUid задан → белый привязывается к Истории (её ID на плашке) и стрелка НЕ создаётся;
// иначе → белый напрямую под задачей + дефолтная стрелка на цветной родитель.
function openSubtaskModal(issueId,storyUid){
  const iss=state.issues.find(i=>i.id===issueId);if(!iss)return;
  const sy=storyUid?storyById(iss,storyUid):null;
  const sprints=computeSprints();
  const defSprint = sy ? sy.sprint : iss.sprint;
  const defWeek = sy ? itemWeek(sy) : itemWeek(iss);
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal">
    <h3>Декомпозиция · ${esc(sy?(sy.id||'История'):iss.id)}</h3>
    ${sy?`<div class="muted" style="margin-bottom:10px">Подзадача Истории <b>${esc(sy.id||'')}</b> (задача ${esc(iss.id)})</div>`:''}
    <label><span>ФИО</span><input id="m_fio" placeholder="Фамилия"></label>
    <label><span>Компетенция</span><select id="m_role">${teamComps(issuePrimaryTeam(iss)).map(r=>`<option>${r}</option>`).join('')}</select></label>
    <label><span>Ёмкость (дн.)</span><input id="m_cap" type="number" min="0" value="1"></label>
    <label><span>Спринт</span><select id="m_sprint">${sprints.map(s=>`<option value="${s.index}" ${s.index===defSprint?'selected':''}>Спринт ${s.index+1}</option>`).join('')}</select></label>
    ${weekSelectHTML('m_week',defWeek)}
    <div class="modal-actions">
      <button id="m_cancel">Отмена</button>
      <button class="primary" id="m_save">Добавить подзадачу</button>
    </div>
  </div></div>`;
  $('#m_cancel').onclick=()=>{ if(sy){ root.innerHTML=''; openStoryModal(iss.id, storyUid); } else root.innerHTML=''; };
  $('#m_save').onclick=()=>{
    iss.subtasks=iss.subtasks||[];
    const u=uid();
    const white={uid:u,fio:$('#m_fio').value||'—',role:$('#m_role').value,cap:+$('#m_cap').value||0,sprint:+$('#m_sprint').value,week:+$('#m_week').value};
    if(storyUid) white.storyUid=storyUid; // принадлежит Истории
    iss.subtasks.push(white);
    // дефолтная стрелка декомпозиции только для белых напрямую под задачей
    if(!storyUid){
      state.connections=state.connections||[];
      state.connections.push({id:newConnId(), from:{kind:'w',uid:u}, to:{kind:'c',id:iss.id}});
    }
    root.innerHTML='';save();render();
  };
}
/* ---- Модальное окно Истории (зелёный стикер): поля + декомпозиция на белые ---- */
// storyUid=null → создание новой Истории; иначе → редактирование существующей.
function openStoryModal(issueId,storyUid){
  const iss=state.issues.find(i=>i.id===issueId);if(!iss)return;
  const isNew=!storyUid;
  const sy=isNew?null:storyById(iss,storyUid);
  if(!isNew && !sy)return;
  const sprints=computeSprints();
  const scomps=teamComps(issuePrimaryTeam(iss));
  const cur=sy||{id:'',name:'',comps:{},sprint:iss.sprint,week:itemWeek(iss)};
  const curComps=(sy?storyComps(sy):{});
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal">
    <h3>${isNew?'Новая история':'История'} · задача ${esc(iss.id)}</h3>
    <label><span>ID истории</span><input id="sy_id" value="${esc(cur.id)}" placeholder="напр. ${esc(iss.id)}-S1"></label>
    <label><span>Название (необязательно)</span><input id="sy_name" value="${esc(cur.name||'')}" placeholder="Кратко о истории"></label>
    <div class="row" style="gap:8px">
      ${scomps.map(r=>`<label style="display:flex;flex-direction:column;gap:3px"><span class="muted" style="font-size:11px">${r}</span><input type="number" min="0" style="width:70px" id="sy_${r.toLowerCase()}" value="${esc(+curComps[r]||0)}"></label>`).join('')}
    </div>
    <label style="margin-top:12px"><span>Спринт</span><select id="sy_sprint">${sprints.map(s=>`<option value="${s.index}" ${s.index===cur.sprint?'selected':''}>Спринт ${s.index+1}</option>`).join('')}</select></label>
    ${weekSelectHTML('sy_week',cur.week)}
    ${isNew?`<div class="note" style="margin:6px 0">После создания Историю можно будет декомпозировать на белые подзадачи (кнопка «Добавить подзадачу» появится в её карточке).</div>`:''}
    <div class="modal-actions" style="justify-content:space-between">
      <div style="display:flex;gap:8px">
        ${isNew?'':`<button class="danger" id="sy_del">Удалить</button>`}
        ${isNew?'':`<button id="sy_decomp">Добавить подзадачу</button>`}
      </div>
      <div style="display:flex;gap:8px">
        <button id="sy_cancel">Отмена</button>
        <button class="primary" id="sy_save">${isNew?'Создать историю':'Сохранить'}</button>
      </div>
    </div>
  </div></div>`;
  const readForm=()=>{
    const comps={}; scomps.forEach(r=>{ comps[r]=+$('#sy_'+r.toLowerCase()).value||0; });
    return { id:$('#sy_id').value.trim(), name:$('#sy_name').value.trim(), comps, sprint:+$('#sy_sprint').value, week:+$('#sy_week').value };
  };
  $('#sy_cancel').onclick=()=>root.innerHTML='';
  $('#sy_save').onclick=()=>{
    const f=readForm();
    if(!f.id){ toast('Укажите ID истории',{type:'warn'}); return; }
    if(isNew){
      iss.stories=iss.stories||[];
      iss.stories.push({uid:uid(), id:f.id, name:f.name, comps:f.comps, sprint:f.sprint, week:f.week});
    }else{
      Object.assign(sy,{id:f.id, name:f.name, comps:f.comps, sprint:f.sprint, week:f.week});
    }
    root.innerHTML=''; save(); render();
  };
  const del=$('#sy_del'); if(del)del.onclick=()=>{
    const childUids=(iss.subtasks||[]).filter(st=>st.storyUid===sy.uid).map(st=>st.uid);
    state.connections=(state.connections||[]).filter(c=>
      !(c.from.kind==='w'&&childUids.includes(c.from.uid)) && !(c.to.kind==='w'&&childUids.includes(c.to.uid)));
    iss.subtasks=(iss.subtasks||[]).filter(st=>st.storyUid!==sy.uid);
    iss.stories=(iss.stories||[]).filter(s=>s.uid!==sy.uid);

/* ---- Геометрия краёв ----
   Точка прикрепления стрелки выбирается на той кромке стикера (верх/низ/лево/право),
   которая обращена к точке `aim` (другой конец или точка изгиба). Возвращает координаты
   точки и внешнюю нормаль кромки (nx,ny) — чтобы линия входила/выходила перпендикулярно. */
function edgePointN(box, aim){
  const c={x:box.x+box.w/2, y:box.y+box.h/2};
  const dx=aim.x-c.x, dy=aim.y-c.y;
  if(Math.abs(dx)>=Math.abs(dy)){
    return dx>=0 ? {x:box.x+box.w, y:c.y, nx:1, ny:0} : {x:box.x, y:c.y, nx:-1, ny:0};
  }
  return dy>=0 ? {x:c.x, y:box.y+box.h, nx:0, ny:1} : {x:c.x, y:box.y, nx:0, ny:-1};
}
function epElement(scope,ep){
  if(!ep)return null;
  return ep.kind==='c'
    ? scope.querySelector(`.sticker[data-sticker="${CSS.escape(ep.id)}"]`)
    : scope.querySelector(`.white[data-wuid="${CSS.escape(ep.uid)}"]`);
}

/* ---- Стрелки декомпозиции (по одной на белую подзадачу), редактируемые ---- */
function findConnection(id){ return (state.connections||[]).find(c=>c.id===id); }
// сравнение двух концов связи (стикеров)
function sameEp(a,b){ return !!a&&!!b&&a.kind===b.kind&&(a.kind==='c'?a.id===b.id:a.uid===b.uid); }
// задача (issue), которой принадлежит конец связи — для цвета/фокуса
function epIssue(ep){
  if(!ep) return null;
  if(ep.kind==='c') return state.issues.find(i=>i.id===ep.id)||null;
  for(const i of state.issues){ for(const st of (i.subtasks||[])){ if(st.uid===ep.uid) return i; } }
  return null;
}
function edgeIssue(edge){ return edge ? (epIssue(edge.from)||epIssue(edge.to)) : null; }
// Удаление связи по id.
function deleteConnection(id){
  state.connections=(state.connections||[]).filter(c=>c.id!==id);
  if(state.ui.selectedArrow===id) state.ui.selectedArrow=null;
  save(); render();
  toast('Связь удалена',{type:'info'});
}
function scrollPoint(scroll,clientX,clientY){
  const cr=scroll.getBoundingClientRect();
  return { x:clientX-cr.left+scroll.scrollLeft, y:clientY-cr.top+scroll.scrollTop };
}
function elCenterInScroll(scroll,el){
  const cr=scroll.getBoundingClientRect(); const r=el.getBoundingClientRect();
  return { x:r.left-cr.left+scroll.scrollLeft+r.width/2, y:r.top-cr.top+scroll.scrollTop+r.height/2 };
}
let arrowDrag=null;
let hoverFocus=null; // id задачи под курсором (для подсветки), не сохраняется в state
// Подсветка по наведению:
//  - на задачу (storyUid=null) — подсвечиваем все её стикеры (Истории + белые);
//  - на Историю (storyUid задан) — подсвечиваем только эту Историю и её белые (data-story===storyUid).
function setBoardFocus(id,mode,storyUid){
  const scroll=$('#boardScroll'); if(!scroll)return;
  hoverFocus=id||null;
  if(id){
    scroll.classList.add('lane-focus');
    scroll.querySelectorAll('.sticker,.white,.story').forEach(el=>{
      const isSticker=el.classList.contains('sticker');
      const isWhite=el.classList.contains('white');
      let on;
      if(mode==='story'){
        // ветка одной Истории (сам зелёный стикер + её белые) + задача-родитель (цветной стикер)
        on = el.dataset.story===storyUid || (isSticker && el.dataset.id===id);
      }else if(mode==='direct'){
        // задача-родитель (цветной) + только её прямые белые (без Истории), Истории не подсвечиваем
        on = (isSticker && el.dataset.id===id) || (isWhite && el.dataset.wissue===id && !el.dataset.story);
      }else{
        const eid=el.dataset.id||el.dataset.wissue||el.dataset.storyIssue;
        on = eid===id; // вся задача (Истории + все белые)
      }
      el.classList.toggle('lane-on', on);
    });
  }else{
    scroll.classList.remove('lane-focus');
    scroll.querySelectorAll('.lane-on').forEach(el=>el.classList.remove('lane-on'));
  }
  drawArrows();
}
function onArrowMove(e){
  if(!arrowDrag)return;
  const scroll=$('#boardScroll'); const prev=$('#arrowPreview'); if(!scroll||!prev)return;
  const p=scrollPoint(scroll,e.clientX,e.clientY);
  prev.setAttribute('d',`M ${arrowDrag.anchor.x} ${arrowDrag.anchor.y} L ${p.x} ${p.y}`);
  prev.setAttribute('opacity','1');
}
function onArrowUp(e){
  document.removeEventListener('mousemove',onArrowMove);
  document.removeEventListener('mouseup',onArrowUp);
  const drag=arrowDrag; arrowDrag=null;
  if(!drag){return;}
  // временно скрываем svg, чтобы elementFromPoint вернул стикер под курсором
  const svg=$('#arrowLayer'); const disp=svg?svg.style.display:'';
  if(svg) svg.style.display='none';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(svg) svg.style.display=disp;
  const target=el&&el.closest('.sticker,.white');
  if(target){
    const ep = target.classList.contains('sticker')
      ? {kind:'c',id:target.dataset.id}
      : {kind:'w',uid:target.dataset.wuid};
    if(drag.create){
      // создание новой связи: from — исходный стикер, to — цель
      const dup=(state.connections||[]).some(c=>sameEp(c.from,drag.from)&&sameEp(c.to,ep));
      if(!sameEp(drag.from,ep) && !dup){
        const id=newConnId();
        state.connections.push({id, from:drag.from, to:ep});
        state.ui.selectedArrow=id; save();
        toast('Связь создана',{type:'success'});
      }
    }else if(drag.edgeId){
      // перетягивание конца существующей связи на другой стикер
      const edge=findConnection(drag.edgeId);
      if(edge){
        const otherEnd=drag.end==='from'?edge.to:edge.from;
        if(!sameEp(otherEnd,ep)){ edge[drag.end]=ep; save(); }
      }
    }
  }
  render();
}
function drawArrows(){
  const scroll=$('#boardScroll');const svg=$('#arrowLayer');if(!scroll||!svg)return;
  const W=scroll.scrollWidth,H=scroll.scrollHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const cr=scroll.getBoundingClientRect();
  const off=el=>{const r=el.getBoundingClientRect();return{
    x:r.left-cr.left+scroll.scrollLeft, y:r.top-cr.top+scroll.scrollTop, w:r.width, h:r.height};};
  let paths='', hits='', handles='', dels='';
  const sel=state.ui.selectedArrow;
  // одна стрелка на каждую связь из state.connections (рисуем только те, чьи оба конца на доске)
  (state.connections||[]).forEach(edge=>{
    const aEl=epElement(scroll,edge.from), bEl=epElement(scroll,edge.to);
    if(!aEl||!bEl)return;
    const A=off(aEl), B=off(bEl);
    const cA={x:A.x+A.w/2, y:A.y+A.h/2}, cB={x:B.x+B.w/2, y:B.y+B.h/2};
    // середина по центрам стикеров — база для смещения изгиба (переживает перемещение стикеров)
    const mC={x:(cA.x+cB.x)/2, y:(cA.y+cB.y)/2};
    const bent = edge.bend && (edge.bend.dx||edge.bend.dy);
    const P = bent ? {x:mC.x+edge.bend.dx, y:mC.y+edge.bend.dy} : null;
    // концы прикрепляются к кромке, обращённой к точке, куда направлена линия
    // (к другому стикеру, а при изгибе — к точке P): вход возможен сверху, снизу и по бокам
    const ps = edgePointN(A, P||cB);
    const ce = edgePointN(B, P||cA);
    let d, midPt;
    if(bent){
      // тянем линию: квадратичная кривая проходит через точку P (середина + смещение)
      const wp={x:2*P.x-(ps.x+ce.x)/2, y:2*P.y-(ps.y+ce.y)/2};
      d=`M ${ps.x} ${ps.y} Q ${wp.x} ${wp.y} ${ce.x} ${ce.y}`;
      midPt=P;
    }else{
      // плавная кубическая кривая: выходим и входим перпендикулярно выбранным кромкам
      const k=Math.max(26, Math.hypot(ce.x-ps.x, ce.y-ps.y)*0.4);
      const c1={x:ps.x+ps.nx*k, y:ps.y+ps.ny*k};
      const c2={x:ce.x+ce.nx*k, y:ce.y+ce.ny*k};
      d=`M ${ps.x} ${ps.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${ce.x} ${ce.y}`;
      midPt={x:(ps.x+ce.x)/2, y:(ps.y+ce.y)/2};
    }
    const on=sel===edge.id;
    const iss=edgeIssue(edge);
    const hue=iss?issueHue(iss):'#8893ab';              // цвет стрелки = цвет задачи
    const dim=hoverFocus && (!iss || iss.id!==hoverFocus); // приглушение при фокусе на другой задаче
    const stroke = on ? '#3fae7d' : hue;
    const op = dim ? 0.12 : 1;
    const w = on ? 1.9 : (hoverFocus && !dim ? 1.8 : 1.2);
    paths+=`<path d="${d}" stroke="${stroke}" stroke-width="${w}" fill="none" marker-end="url(#ah)" opacity="${op}" style="pointer-events:none"/>`;
    hits+=`<path d="${d}" data-arrow="${esc(edge.id)}" stroke="transparent" stroke-width="14" fill="none" style="pointer-events:stroke;cursor:grab"/>`;
    if(on){
      [['from',ps],['to',ce]].forEach(([end,pt])=>{
        handles+=`<circle class="arrow-handle" data-edge="${esc(edge.id)}" data-end="${end}" cx="${pt.x}" cy="${pt.y}" r="6"
          fill="#15151f" stroke="#3fae7d" stroke-width="2" style="pointer-events:auto;cursor:grab"/>`;
      });
      // кнопка удаления связи — рядом с точкой изгиба
      const mx=midPt.x, my=midPt.y-16;
      dels+=`<g class="arrow-del" data-delarrow="${esc(edge.id)}" style="pointer-events:auto;cursor:pointer">
        <circle cx="${mx}" cy="${my}" r="9" fill="#15151f" stroke="#d06576" stroke-width="1.6"/>
        <path d="M ${mx-3.4} ${my-3.4} L ${mx+3.4} ${my+3.4} M ${mx+3.4} ${my-3.4} L ${mx-3.4} ${my+3.4}" stroke="#ec8a98" stroke-width="1.8" stroke-linecap="round"/>
      </g>`;
    }
  });
  svg.innerHTML=`<defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="context-stroke"/></marker>
    </defs>${hits}${paths}<path id="arrowPreview" d="" stroke="#3fae7d" stroke-width="1.6" stroke-dasharray="4 3" fill="none" opacity="0" style="pointer-events:none"/>${handles}${dels}`;
  // линия стрелки: тянем = изгибаем (оттягиваем в сторону); клик без движения = выбор/снятие
  svg.querySelectorAll('[data-arrow]').forEach(p=>{
    p.addEventListener('mousedown',(e)=>{
      e.preventDefault(); e.stopPropagation();
      const id=p.dataset.arrow;
      const edge=findConnection(id); if(!edge)return;
      const aEl=epElement(scroll,edge.from), bEl=epElement(scroll,edge.to); if(!aEl||!bEl)return;
      const aC=elCenterInScroll(scroll,aEl), bC=elCenterInScroll(scroll,bEl);
      const mC={x:(aC.x+bC.x)/2, y:(aC.y+bC.y)/2};
      const start={x:e.clientX,y:e.clientY};
      let moved=false;
      const move=(ev)=>{
        if(!moved && Math.abs(ev.clientX-start.x)+Math.abs(ev.clientY-start.y)<4) return;
        moved=true;
        const pt=scrollPoint(scroll,ev.clientX,ev.clientY);
        edge.bend={dx:pt.x-mC.x, dy:pt.y-mC.y};
        drawArrows(); // живой предпросмотр изгиба
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        if(moved){ save(); }                 // изгиб сохранён, доска не перерисовывается
        else { state.ui.selectedArrow = state.ui.selectedArrow===id?null:id; save(); render(); }
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    });
    // двойной клик по линии — выпрямить (сбросить изгиб)
    p.addEventListener('dblclick',(e)=>{
      e.stopPropagation();
      const edge=findConnection(p.dataset.arrow);
      if(edge && edge.bend){ delete edge.bend; save(); render(); toast('Стрелка выпрямлена',{type:'info'}); }
    });
  });
  // удаление связи кнопкой ×
  svg.querySelectorAll('[data-delarrow]').forEach(g=>g.addEventListener('click',(e)=>{
    e.stopPropagation();
    deleteConnection(g.dataset.delarrow);
  }));
  // перетаскивание концов выбранной связи
  svg.querySelectorAll('.arrow-handle').forEach(h=>h.addEventListener('mousedown',(e)=>{
    e.preventDefault(); e.stopPropagation();
    const id=h.dataset.edge, end=h.dataset.end;
    const edge=findConnection(id); if(!edge)return;
    const otherEp = end==='from'? edge.to : edge.from;
    const otherEl = epElement(scroll,otherEp);
    arrowDrag={edgeId:id, end, anchor: otherEl?elCenterInScroll(scroll,otherEl):{x:0,y:0}};
    document.addEventListener('mousemove',onArrowMove);
    document.addEventListener('mouseup',onArrowUp);
  }));
}

/* =====================================================================
   ВКЛАДКА 6 — Риски
   Модель: state.risks = { general:[...], teams:{ 'Трайб||Команда':[...] } }
   Запись риска: { id, desc, owner, impact, control, plan, shared? }
   - Риски с вкладки «Общие риски» лежат в state.risks.general.
   - Командные риски лежат в state.risks.teams[ключ команды].
   - Командный риск с флагом shared=true («Общий риск») ЗЕРКАЛИТСЯ на вкладку
     «Общие риски» (единый источник данных, без копий): снятие галочки убирает
     его из общих, правка на командной вкладке отражается в общих.
   Ролевая модель (на будущее): общие риски правят только админы
   (Отдел развития гибких практик), командные — Product Owner команды.
   До внедрения ролевой модели ограничений нет.
===================================================================== */
const RISK_COLS=[
  ['desc','Описание риска'],
  ['owner','Владелец'],
  ['impact','Влияние'],
  ['control','Контрольная дата/событие'],
  ['plan','План работы с риском'],
];
// Список рисков текущего контекста (общие либо выбранная команда) или null,
// если на командной под-вкладке команда ещё не выбрана.
function currentRiskList(){
  if(state.ui.riskView==='general') return riskRows().filter(r=>r.scope==='general');
  const team=selectedRiskTeam();
  if(!team)return null;
  return riskRows().filter(r=>r.scope==='team'&&String(r.teamId)===String(team.id));
}
// Командные риски, отмеченные как общебанковские (shared) — для зеркала на «Общие риски»
function sharedTeamRisks(){
  return riskRows().filter(r=>r.scope==='team'&&r.shared).map(r=>{
    const team=riskTeamOptions().find(t=>String(t.id)===String(r.teamId));
    return {r,team:team?team.name:'Команда'};
  });
}

function legacyViewRisksLocal(){
  if(state.ui.riskView==='team'&&state.ui.riskTeam){
    const selectedExists=(state.pi.teams||[]).some(team=>
      team.tribe===state.ui.riskTribe&&team.name===state.ui.riskTeam
    );
    if(!selectedExists){state.ui.riskTeam=null;state.ui.riskTribe=null;}
  }
  const v=state.ui.riskView;
  let html=`<div class="card"><h2>Риски ${cycleBadge()}</h2>`;
  // Переключатель под-вкладок
  html+=`<div style="margin-bottom:18px">
    <span class="pill ${v==='general'?'sel':''}" data-risk-view="general">Общие риски</span>
    <span class="pill ${v==='team'?'sel':''}" data-risk-view="team">Командные риски</span>
  </div>`;

  if(v==='team' && !state.ui.riskTeam){
    html+=viewRiskTeamSelect();
    html+=`</div>`;
    return html;
  }

  // Командная под-вкладка с выбранной командой — плашка + смена команды
  if(v==='team'){
    html+=`<div class="team-toolbar">
      <span class="team-title">${esc(state.ui.riskTeam)}</span>
      <button class="ghost" id="riskTeamBack">← Выбор команды</button>
    </div>`;
  }

  html+=`<div class="row" style="margin-bottom:14px">
    <button class="plus" id="riskAdd">+</button>
    <span>Добавить риск</span>
  </div>`;

  html += v==='team' ? viewTeamRiskTable() : viewGeneralRiskTable();
  html+=`</div>`;
  return html;
}
// Таблица «Общие риски»: собственные общие риски + зеркало отмеченных командных
function viewGeneralRiskTable(){
  const gen=riskRows().filter(r=>r.scope==='general');
  const shared=sharedTeamRisks();
  let html=`<table><thead><tr><th style="width:40px">N</th>`+
    RISK_COLS.map(c=>`<th>${c[1]}</th>`).join('')+
    `<th style="width:120px"></th></tr></thead><tbody>`;
  if(!gen.length && !shared.length){
    html+=`<tr><td colspan="${RISK_COLS.length+2}" class="muted">Рисков пока нет</td></tr>`;
  }else{
    let n=0;
    gen.forEach(r=>{
      n++;
      html+=`<tr><td>${n}</td>`+
        RISK_COLS.map(c=>`<td>${esc(r[c[0]])||'<span class=auto>—</span>'}</td>`).join('')+
        `<td style="white-space:nowrap">
           <button class="icon sm" data-rg-edit="${esc(r.id)}">Изменить</button>
           <button class="icon danger sm" data-rg-del="${esc(r.id)}">✕</button>
         </td></tr>`;
    });
    shared.forEach(({r,team})=>{
      n++;
      html+=`<tr><td>${n}</td>`+
        RISK_COLS.map((c,ci)=> ci===0
          ? `<td>${esc(r.desc)||'<span class=auto>—</span>'}<div class="muted" style="font-size:11px;margin-top:2px">↳ из команды: ${esc(team)}</div></td>`
          : `<td>${esc(r[c[0]])||'<span class=auto>—</span>'}</td>`
        ).join('')+
        `<td class="auto" style="font-size:11px">правится в команде</td></tr>`;
    });
  }
  html+=`</tbody></table>`;
  return html;
}
// Таблица «Командные риски»: + столбец-чекбокс «Общий риск»
function viewTeamRiskTable(){
  const list=currentRiskList()||[];
  let html=`<table><thead><tr><th style="width:40px">N</th>`+
    RISK_COLS.map(c=>`<th>${c[1]}</th>`).join('')+
    `<th style="width:90px;text-align:center">Общий риск</th>`+
    `<th style="width:120px"></th></tr></thead><tbody>`;
  if(!list.length){
    html+=`<tr><td colspan="${RISK_COLS.length+3}" class="muted">Рисков пока нет</td></tr>`;
  }else{
    list.forEach((r,i)=>{

const RISK_STATUS_LABELS={open:'Открыт',watching:'Наблюдение',closed:'Закрыт'};
const RISK_ROAM_LABELS={resolved:'Resolved',owned:'Owned',accepted:'Accepted',mitigated:'Mitigated'};
function riskRef(){const c=activeCycle();return (c&&c.riskReference)||{};}
function riskRows(){const c=activeCycle();return (c&&Array.isArray(c.riskRows))?c.riskRows:[];}
function riskTribeOptions(){return riskRef().tribes||[];}
function riskTeamOptions(){return riskRef().teams||[];}
function riskInitiativeOptions(){return riskRef().initiatives||[];}
function selectedRiskTeam(){
  const teams=riskTeamOptions();
  if(state.ui.riskTeamId){
    const byId=teams.find(t=>String(t.id)===String(state.ui.riskTeamId));
    if(byId)return byId;
  }
  return teams.find(t=>t.name===state.ui.riskTeam&&t.tribe===state.ui.riskTribe)||null;
}
function riskLinkLabel(r){
  if(r.scope==='team'){
    const t=riskTeamOptions().find(x=>String(x.id)===String(r.teamId));
    return t?`${t.tribe} / ${t.name}`:'Команда';
  }
  if(r.scope==='tribe'){
    const t=riskTribeOptions().find(x=>String(x.id)===String(r.tribeId));
    return t?t.name:'Трайб';
  }
  if(r.scope==='initiative'){
    const i=riskInitiativeOptions().find(x=>String(x.id)===String(r.initiativeId));
    return i?`${i.issue_key} · ${i.title}`:'Инициатива';
  }
  return 'Общий риск';
}
function viewRisks(){
  const teams=riskTeamOptions(),tribes=riskTribeOptions();
  const selectedTeam=selectedRiskTeam();
  if(state.ui.riskView==='team'&&state.ui.riskTeam&&!selectedTeam){
    state.ui.riskTeam=null;
    state.ui.riskTeamId='';
  }
  const view=state.ui.riskView==='team'?'team':'general';
  let html=`<div class="card"><h2>Риски ${cycleBadge()}</h2>`;
  if(!risksApiReady&&!risksBoards[currentCycleId()])return html+`<div class="muted">Загрузка рисков с backend...</div></div>`;
  if(!cycleBackendIds[currentCycleId()])return html+`<div class="muted">Backend недоступен или PI-цикл не выбран.</div></div>`;
  if(!teams.length&&!tribes.length)return html+`<div class="muted">Добавьте трайбы и команды на вкладке «Данные PI-цикла». Риски не создаются из демонстрационных данных.</div></div>`;
  html+=`<div style="margin-bottom:18px">
    <span class="pill ${view==='general'?'sel':''}" data-risk-view="general">Общие риски</span>
    <span class="pill ${view==='team'?'sel':''}" data-risk-view="team">Командные риски</span>
  </div>`;
  if(view==='team'&&!selectedTeam){
    html+=viewRiskTeamSelect()+`</div>`;
    return html;
  }
  if(view==='team'){
    html+=`<div class="team-toolbar"><span class="team-title">${esc(selectedTeam.name)}</span><button class="ghost" id="riskTeamBack">← Выбор команды</button></div>`;
  }
  html+=`<div class="row" style="margin-bottom:14px"><button class="plus" id="riskAdd">+</button><span>Добавить риск</span></div>`;
  html+=view==='team'?viewTeamRiskTable():viewGeneralRiskTable();
  html+=`</div>`;
  return html;
}

function openRiskModal(riskId){
  const r=riskRows().find(x=>x.id===riskId)||{};
  const isTeam=state.ui.riskView==='team';
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal">
    <h3>${riskId?'Редактирование риска':'Новый риск'}</h3>

    <label><span>Влияние</span><input id="rm_impact" value="${esc(r.impact||'')}"></label>
    <label><span>Контрольная дата/событие</span><input id="rm_control" value="${esc(r.control||'')}"></label>
    <label><span>План работы с риском</span><textarea id="rm_plan" rows="2">${esc(r.plan||'')}</textarea></label>

    <div class="modal-actions"><button id="rm_cancel">Отмена</button><button class="primary" id="rm_save">Сохранить</button></div>
  </div></div>`;
  $('#rm_cancel').onclick=()=>root.innerHTML='';
  $('#rm_save').onclick=async()=>{
    const payload=riskPayloadFromModal();
    if(!payload.description){toast('Укажите описание риска',{type:'warn'});return;}

    try{await run();root.innerHTML='';toast(riskId?'Риск обновлён':'Риск создан',{type:'success'});}
    catch(error){handleCommandError(error,run);}
  };
}
function deleteRiskUi(riskId){
  showConfirm('Удаление риска','Риск будет удалён из активного PI-цикла.',[],async()=>{
    try{await risksBoardCommand(`/risks/${riskId}`,'DELETE',{});toast('Риск удалён',{type:'info'});}
    catch(error){handleCommandError(error,()=>risksBoardCommand(`/risks/${riskId}`,'DELETE',{}));}
  });
}
function bindRiskRowDrag(){
  let dragId=null;
  document.querySelectorAll('tr[data-riskdrag-id]').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{
      if(e.target.closest('select,button')){e.preventDefault();return;}
      dragId=tr.dataset.riskdragId; e.dataTransfer.effectAllowed='move'; tr.classList.add('dragging');
    });
    tr.addEventListener('dragend',()=>{tr.classList.remove('dragging');clearPrepRowDropMarkers();});
    tr.addEventListener('dragover',e=>{
      e.preventDefault();
      const after=isPrepDropAfter(tr,e);
      tr.classList.toggle('rowdragover-before',!after);
      tr.classList.toggle('rowdragover-after',after);
    });
    tr.addEventListener('dragleave',()=>clearPrepRowDropMarkers(tr));
    tr.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation(); clearPrepRowDropMarkers(tr);
      moveRisk(dragId,tr.dataset.riskdragId,isPrepDropAfter(tr,e));
    });
  });
}
async function moveRisk(fromId,targetId,after){
  if(!fromId||!targetId||fromId===targetId)return;
  const ids=riskRows().map(r=>r.id);
  const from=ids.indexOf(fromId),target=ids.indexOf(targetId);
  if(from<0||target<0)return;
  const [item]=ids.splice(from,1);
  let insertAt=after?target+1:target;
  if(from<insertAt)insertAt--;
  ids.splice(insertAt,0,item);
  try{await risksBoardCommand('/order','PUT',{risk_ids:ids});toast('Порядок рисков обновлён',{type:'success'});}
  catch(error){handleCommandError(error,()=>risksBoardCommand('/order','PUT',{risk_ids:ids}));}
}

/* =====================================================================
   DRAG & DROP (общий механизм)
   onDrop(payload,target) ; targetSel — селектор зон ; targetVal — функция значения
===================================================================== */
function enableDrag(scope,onDrop,targetSel,targetVal){
  scope.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      const payload={kind:el.dataset.drag,id:el.dataset.id,sub:el.dataset.sub!==undefined?+el.dataset.sub:undefined,story:el.dataset.storyUid};
      e.dataTransfer.setData('text/plain',JSON.stringify(payload));
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>el.style.opacity='.4',0);
    });
    el.addEventListener('dragend',()=>el.style.opacity='1');
  });
  scope.querySelectorAll(targetSel).forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('dragover');
      try{const payload=JSON.parse(e.dataTransfer.getData('text/plain'));onDrop(payload,targetVal(zone),e);}catch(err){}
    });
  });
}
