# Конфиг сервера для фронтенд-контейнера nginx (:8080) в docker-compose.
# Статику (index.html и js/css) отдаём с обязательной перевалидацией кэша,
# чтобы после правок/деплоя браузер всегда подтягивал актуальные файлы.
# API-запросы с :8080 идут напрямую на FastAPI (:8000), их кэширование
# закрывается middleware в backend/app/main.py.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
