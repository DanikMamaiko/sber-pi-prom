nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: nexus.example.local/sberpi/sberpi-api
    tag: "0.1.0"
    digest: ""
    pullPolicy: Always
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: nexus.example.local/sberpi/sberpi-frontend
    tag: "0.1.0"
    digest: ""
    pullPolicy: Always
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

serviceAccount:
  create: true
  name: ""

# This secret must already exist in the target namespace before helm install.
# Required keys: DATABASE_URL, SESSION_SECRET, LDAP_BIND_DN and LDAP_BIND_PASSWORD
# when config.authProvider is ldap; JIRA_USERNAME and JIRA_PASSWORD when Jira is enabled.
secrets:
  existingSecret: sberpi-secrets
  # files (preferred) or env (legacy compatibility). Restart pods after rotation.
  mode: files

config:
  appName: SberPI PI Cycle MVP
  appEnv: production
  corsOrigins: https://sberpi.apps.k8s-ift.sigma-belpsb.by
  authProvider: ldap
  sessionTtlMinutes: "60"
  sessionCookieName: sberpi_session
  sessionCookieSecure: "true"
  jiraEnabled: "false"
  jiraBaseUrl: https://jira-apptst-ift.sigma-belpsb.by/jira
  jiraVerifySsl: "true"
  jiraCaBundle: ""
  jiraTimeoutSeconds: "10"
  jiraWorkdayHours: "8"
  auditEnabled: "true"
  auditSourceService: sberpi-api
  auditHostIp: ""
  auditTrustedProxyNetworks: ""
  auditConnectTimeoutSeconds: "3"
  auditRetrySeconds: "30"
  adGroupAdmin: CN=SberPI-Admins,OU=SberPI,OU=Groups for soft access,OU=Groups,OU=Tech,DC=sigma-belpsb,DC=by
  adGroupPlanningEditor: CN=SberPI-PlanningEditors,OU=SberPI,OU=Groups for soft access,OU=Groups,OU=Tech,DC=sigma-belpsb,DC=by
  adGroupBusinessViewer: CN=SberPI-BusinessViewers,OU=SberPI,OU=Groups for soft access,OU=Groups,OU=Tech,DC=sigma-belpsb,DC=by
  adGroupViewer: CN=SberPI-Viewers,OU=SberPI,OU=Groups for soft access,OU=Groups,OU=Tech,DC=sigma-belpsb,DC=by
  ldapUrl: ldap://sigma-belpsb.by:389
  ldapBaseDn: DC=sigma-belpsb,DC=by
  ldapUserSearchBase: DC=sigma-belpsb,DC=by
  ldapUserFilter: "(sAMAccountName={username})"
  ldapGroupSearchBase: OU=Groups,OU=Tech,DC=sigma-belpsb,DC=by
  ldapGroupFilter: "(member={user_dn})"
  ldapUseTls: "false"
  ldapConnectTimeoutSeconds: "5"

migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: sberpi.apps.k8s-ift.sigma-belpsb.by
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Enable after the platform team supplies destinations and confirms CNI support.
# Empty peers never mean allow-all. For a separate audit DB include both peers.
networkPolicy:
  enabled: false
  ingressPeers: []
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  database:
    port: 5432
    peers: []
  # Kubernetes egress rules for LDAP, Jira and other approved API dependencies.
  apiExtraEgress: []
