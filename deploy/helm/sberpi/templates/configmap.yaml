{{- if eq (.Values.config.siemSyslogEnabled | default "false" | toString | lower) "true" }}
{{- $target := required "config.siemSyslogTarget is required when SIEM is enabled" .Values.config.siemSyslogTarget }}
{{- if not (regexMatch "^[0-9a-fA-F:.]+$" $target) }}
{{- fail "config.siemSyslogTarget must be the collector IP, not a URL or placeholder" }}
{{- end }}
{{- if ne (.Values.config.siemSyslogProtocol | default "udp" | lower) "udp" }}
{{- fail "Direct SIEM syslog supports only udp" }}
{{- end }}
{{- $port := .Values.config.siemSyslogPort | default "514" | int }}
{{- if or (lt $port 1) (gt $port 65535) }}
{{- fail "config.siemSyslogPort must be between 1 and 65535" }}
{{- end }}
{{- if ne (.Values.config.auditEnabled | toString | lower) "true" }}
{{- fail "SIEM requires config.auditEnabled=true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "sberpi.fullname" . }}-config
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  AUTH_PROVIDER: {{ .Values.config.authProvider | quote }}
  SESSION_TTL_MINUTES: {{ .Values.config.sessionTtlMinutes | quote }}
  SESSION_COOKIE_NAME: {{ .Values.config.sessionCookieName | quote }}
  SESSION_COOKIE_SECURE: {{ .Values.config.sessionCookieSecure | quote }}
  JIRA_ENABLED: {{ .Values.config.jiraEnabled | quote }}
  JIRA_BASE_URL: {{ .Values.config.jiraBaseUrl | quote }}
  JIRA_VERIFY_SSL: {{ .Values.config.jiraVerifySsl | quote }}
  JIRA_CA_BUNDLE: {{ .Values.config.jiraCaBundle | quote }}
  JIRA_TIMEOUT_SECONDS: {{ .Values.config.jiraTimeoutSeconds | quote }}
  JIRA_MAX_CONCURRENT_REQUESTS: {{ .Values.config.jiraMaxConcurrentRequests | quote }}
  JIRA_MAX_QUEUE_SIZE: {{ .Values.config.jiraMaxQueueSize | quote }}
  JIRA_QUEUE_TIMEOUT_SECONDS: {{ .Values.config.jiraQueueTimeoutSeconds | quote }}
  JIRA_WORKDAY_HOURS: {{ .Values.config.jiraWorkdayHours | quote }}
  AUDIT_ENABLED: {{ .Values.config.auditEnabled | quote }}
  AUDIT_SOURCE_SERVICE: {{ .Values.config.auditSourceService | quote }}
  AUDIT_HOST_IP: {{ .Values.config.auditHostIp | quote }}
  AUDIT_TRUSTED_PROXY_NETWORKS: {{ .Values.config.auditTrustedProxyNetworks | quote }}
  AUDIT_CONNECT_TIMEOUT_SECONDS: {{ .Values.config.auditConnectTimeoutSeconds | quote }}
  AUDIT_RETRY_SECONDS: {{ .Values.config.auditRetrySeconds | quote }}
  SIEM_SYSLOG_ENABLED: {{ .Values.config.siemSyslogEnabled | default "false" | quote }}
  SIEM_SYSLOG_TARGET: {{ .Values.config.siemSyslogTarget | default "" | quote }}
  SIEM_SYSLOG_PORT: {{ .Values.config.siemSyslogPort | default "514" | quote }}
  SIEM_SYSLOG_PROTOCOL: {{ .Values.config.siemSyslogProtocol | default "udp" | quote }}
  SIEM_SYSLOG_HOSTNAME: {{ .Values.config.siemSyslogHostname | default "sberpi-sigma" | quote }}
  AD_GROUP_ADMIN: {{ .Values.config.adGroupAdmin | quote }}
  AD_GROUP_PLANNING_EDITOR: {{ .Values.config.adGroupPlanningEditor | quote }}
  AD_GROUP_BUSINESS_VIEWER: {{ .Values.config.adGroupBusinessViewer | quote }}
  AD_GROUP_VIEWER: {{ .Values.config.adGroupViewer | quote }}
  LDAP_URL: {{ .Values.config.ldapUrl | quote }}
  LDAP_BASE_DN: {{ .Values.config.ldapBaseDn | quote }}
  LDAP_USER_SEARCH_BASE: {{ .Values.config.ldapUserSearchBase | quote }}
  LDAP_USER_FILTER: {{ .Values.config.ldapUserFilter | quote }}
  LDAP_GROUP_SEARCH_BASE: {{ .Values.config.ldapGroupSearchBase | quote }}
  LDAP_GROUP_FILTER: {{ .Values.config.ldapGroupFilter | quote }}
  LDAP_USE_TLS: {{ .Values.config.ldapUseTls | quote }}
  LDAP_CA_BUNDLE: {{ .Values.config.ldapCaBundle | default "" | quote }}
  LDAP_CONNECT_TIMEOUT_SECONDS: {{ .Values.config.ldapConnectTimeoutSeconds | quote }}
