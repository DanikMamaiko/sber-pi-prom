apiVersion: v1
kind: Service
metadata:
  name: {{ include "sberpi.fullname" . }}-api
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sberpi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
