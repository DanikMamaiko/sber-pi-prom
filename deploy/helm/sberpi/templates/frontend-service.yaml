apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "sberpi.fullname" . }}-frontend
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sberpi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
