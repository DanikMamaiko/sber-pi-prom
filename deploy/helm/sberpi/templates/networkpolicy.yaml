{{- if .Values.networkPolicy.enabled }}
{{- if empty .Values.networkPolicy.database.peers }}
{{- fail "networkPolicy.database.peers must contain the approved PostgreSQL destinations" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sberpi.fullname" . }}-frontend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sberpi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.ingressPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    []
    {{- end }}
  egress:
    {{- include "sberpi.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "sberpi.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sberpi.fullname" . }}-api
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sberpi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sberpi.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- include "sberpi.dnsEgress" . | nindent 4 }}
    {{- include "sberpi.databaseEgress" . | nindent 4 }}
    {{- with .Values.networkPolicy.apiExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.migrations.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sberpi.fullname" . }}-migration
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sberpi.labels" . | nindent 4 }}
  annotations:
    # The pre-install migration must already have this policy on first install.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "sberpi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "sberpi.dnsEgress" . | nindent 4 }}
    {{- include "sberpi.databaseEgress" . | nindent 4 }}
{{- end }}
{{- end }}
