# Copy this file to values.local.yaml and replace every CHANGE_ME value.
# values.local.yaml is ignored by Git.
imagePullSecrets:
  - name: CHANGE_ME_NEXUS_PULL_SECRET

api:
  image:
    repository: CHANGE_ME_NEXUS/sberpi/sberpi-api
    tag: "0.1.0"
    digest: "sha256:CHANGE_ME"
    pullPolicy: Always

frontend:
  image:
    repository: CHANGE_ME_NEXUS/sberpi/sberpi-frontend
    tag: "0.1.0"
    digest: "sha256:CHANGE_ME"
    pullPolicy: Always

secrets:
  existingSecret: sberpi-secrets
  mode: files

config:
  corsOrigins: https://CHANGE_ME_APPLICATION_HOST
  authProvider: ldap
  auditTrustedProxyNetworks: "CHANGE_ME_CLUSTER_PROXY_CIDRS"
  jiraEnabled: "true"
  jiraBaseUrl: https://jira-apptst-ift.sigma-belpsb.by/jira
  jiraVerifySsl: "true"
  # Set to a mounted corporate CA path when the public trust store is insufficient.
  jiraCaBundle: ""

ingress:
  className: CHANGE_ME_INGRESS_CLASS
  hosts:
    - host: CHANGE_ME_APPLICATION_HOST
      paths:
        - path: /
          pathType: Prefix
  # Uncomment when the cluster administrator provides a TLS secret.
  # tls:
  #   - secretName: CHANGE_ME_TLS_SECRET
  #     hosts:
  #       - CHANGE_ME_APPLICATION_HOST

networkPolicy:
  enabled: true
  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: CHANGE_ME_INGRESS_NAMESPACE
      podSelector:
        matchLabels:
          app.kubernetes.io/name: CHANGE_ME_INGRESS_CONTROLLER_LABEL
  # Adjust dnsPeers for corporate DNS / NodeLocal DNS when necessary.
  database:
    port: 5432
    peers:
      - ipBlock:
          cidr: CHANGE_ME_POSTGRES_CIDR
  apiExtraEgress:
    - to:
        - ipBlock:
            cidr: CHANGE_ME_LDAP_CIDR
      ports:
        - protocol: TCP
          port: 389
    - to:
        - ipBlock:
            cidr: CHANGE_ME_JIRA_CIDR
      ports:
        - protocol: TCP
          port: 443
