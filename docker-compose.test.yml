services:
  db_test:
    image: postgres:16
    environment:
      POSTGRES_DB: sberpi_test
      POSTGRES_USER: sberpi
      POSTGRES_PASSWORD: sberpi
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sberpi -d sberpi_test"]
      interval: 2s
      timeout: 5s
      retries: 20

